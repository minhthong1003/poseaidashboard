<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta name="description" content="Bảng theo dõi buổi tập PoseAI dành cho giáo viên">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoseAI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PoseAI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Bố cục: menu trái + vùng nội dung; tông navy/teal lấy từ style.css của kiosk */
:root{
  --bg:#080b13; --bg2:#0B1220; --surface:#0e2a4a; --surface2:#133758;
  --accent:#1BB4B4; --text:#F2FAFA; --muted:#7C93A6; --border:#1C3D5E;
  --good:#47ce42; --mid:#F2B544; --bad:#eb3a3a;
  --c-squat:#1BB4B4; --c-plank:#5B9BFF; --c-pushup:#F2B544;
  --display:'Outfit','Be Vietnam Pro',sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#0e2a4a55,transparent 60%),var(--bg);color:var(--text);font:400 15px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--display);padding:0 8px}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);display:flex;gap:10px;align-items:center}
.nav button:hover{background:#ffffff0d;color:var(--text)}
.nav button[aria-current="page"]{background:#1BB4B422;color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side .acct{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.side .acct .email{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.side .acct button{background:#ffffff0d;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--text);text-align:center}
.side .acct button:hover{background:#ffffff18}
.side .note{font-size:12px;color:var(--muted);padding:0 8px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:0 8px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.live.on .dot{background:var(--good);box-shadow:0 0 0 0 #47ce4266;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #47ce4255}70%{box-shadow:0 0 0 7px #47ce4200}100%{box-shadow:0 0 0 0 #47ce4200}}
main{padding:28px 32px 48px;min-width:0;max-width:1280px;width:100%}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:28px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
.card{background:linear-gradient(180deg,#0e2a4a88,#0e2a4a44);border:1px solid var(--border);border-radius:16px;padding:18px 20px;min-width:0;backdrop-filter:blur(6px)}
.card h2{font-size:16px;margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font:600 34px/1.15 var(--display);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .dl{font-size:12px;color:var(--muted)}
.dl .up{color:var(--good)} .dl .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.grid2.b{grid-template-columns:1fr 1.5fr}
.grid2.c{grid-template-columns:1fr 1fr}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:13px;margin-bottom:10px}
.hbar .nm{overflow-wrap:anywhere}
.track{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.hbar .n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.5em;text-align:right}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #1C3D5E66;vertical-align:middle}
tbody tr:hover{background:#ffffff08}
tr.sel{background:#1BB4B418}
tr[data-student],tr[data-ses]{cursor:pointer}
tr.flash{animation:flashrow 3s ease-out 1}
@keyframes flashrow{0%{background:#1BB4B444}100%{background:transparent}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:#47ce4255;background:#47ce4214}
.pill.mid{color:var(--mid);border-color:#F2B54455;background:#F2B54414}
.pill.low{color:var(--bad);border-color:#eb3a3a55;background:#eb3a3a14}
svg text.ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg .grid{stroke:#ffffff14;stroke-width:1}
.chart{width:100%;height:auto;display:block}
.empty{color:var(--muted);padding:24px 0;text-align:center;font-size:13px}
.detail{margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stats div{background:#ffffff08;border-radius:10px;padding:10px 12px}
.stats b{display:block;font:600 22px var(--display)}
.stats span{font-size:12px;color:var(--muted)}
select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
.foot{margin-top:28px;color:var(--muted);font-size:12px}
.code{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.act{display:flex;gap:6px;white-space:nowrap}
.act button{background:#ffffff0d;border:1px solid var(--border);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted);line-height:1.6}
.act button:hover{background:#ffffff18;color:var(--text)}
.act button.danger:hover{background:#eb3a3a22;color:#ff8b8b;border-color:#eb3a3a66}
/* Heatmap lịch tập */
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;display:block}
.heatwrap{display:flex;gap:10px;align-items:flex-start}
.heatdays{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:10px;color:var(--muted);padding-top:1px}
.heatlegend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.heatlegend span{display:inline-flex;align-items:center;gap:5px}
.heatlegend i{width:11px;height:11px;border-radius:3px;display:block}
/* Huy hiệu */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.badge{display:flex;gap:14px;align-items:center}
.badge .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.badge .who{font:600 15px var(--display);overflow-wrap:anywhere}
.badge .lbl{font-size:12px;color:var(--muted)}
.badge .meta{font-size:12px;color:var(--muted);margin-top:2px}
/* Bảng xếp hạng */
.rank{display:flex;flex-direction:column;gap:8px}
.rank .row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;background:#ffffff06}
.rank .pos{font:600 14px var(--display);color:var(--muted);text-align:center}
.rank .row:nth-child(1) .pos{color:#F2B544}
.rank .row:nth-child(2) .pos{color:#cfd8e3}
.rank .row:nth-child(3) .pos{color:#c98a52}
.rank .nm{font-size:13px;overflow-wrap:anywhere}
.ringwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
/* Màn hình đăng nhập / tải / lỗi */
.center-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:linear-gradient(180deg,#0e2a4a88,#0e2a4a44);border:1px solid var(--border);border-radius:16px;padding:32px 28px;backdrop-filter:blur(6px)}
.login-card .brand{justify-content:center;margin-bottom:22px;font-size:22px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.login-card input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px}
.login-card input:focus{border-color:var(--accent)}
.login-card .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1em}
.login-card button[type=submit]{width:100%;margin-top:20px;background:var(--accent);color:#06141f;font-weight:600;border:0;border-radius:10px;padding:11px;font-size:14px}
.login-card button[type=submit]:disabled{opacity:.6;cursor:default}
.login-card .hint{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--accent);animation:spin 0.8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Nút chung / thanh công cụ */
.btn{background:#ffffff0d;border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:#ffffff18}
.btn.pri{background:var(--accent);color:#06141f;border-color:transparent;font-weight:600}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.6;cursor:default}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.srch{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:13px;min-width:170px;flex:1;max-width:260px}
.srch:focus{border-color:var(--accent);outline:none}
/* Lệnh gửi xuống máy PoseAI */
.cmds{display:flex;flex-direction:column;gap:8px}
.cmd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;background:#ffffff06;border:1px solid transparent;border-radius:10px;padding:8px 11px;font-size:13px}
.cmd .ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;background:#ffffff0d}
.cmd .t{min-width:0;overflow-wrap:anywhere}
.cmd .t span{color:var(--muted);font-size:12px}
.cmd .st{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.cmd.wait{background:#F2B54412;border-color:#F2B54433}
.cmd.wait .ic{background:#F2B54426}
.cmd.wait .st{color:var(--mid)}
.cmd .ic svg{width:15px;height:15px;display:block}
.badge .ico svg{width:23px;height:23px;display:block}
/* Hộp chọn học sinh: gõ để tìm thay vì cuộn cả danh sách */
.cbwrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.combo{position:relative;display:inline-flex}
.cbbtn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:9px;min-width:185px;justify-content:space-between;text-align:left}
.cbbtn[aria-expanded="true"]{border-color:var(--accent)}
.cbbtn svg{width:13px;height:13px;flex:none;color:var(--muted)}
.cbbtn .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbpop{position:absolute;z-index:50;top:calc(100% + 6px);left:0;width:min(320px,80vw);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 16px 38px #00000070}
.cbpop .srch{width:100%;max-width:none;min-width:0;margin-bottom:8px;flex:none}
.cblist{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto}
.cblist button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:9px;color:var(--text);font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:38px;width:100%}
.cblist button[hidden]{display:none}
.cblist button:hover{background:#ffffff12}
.cblist button[aria-selected="true"]{background:#1BB4B41f;color:var(--accent)}
.cblist .n{color:var(--muted);font-size:11px;white-space:nowrap;flex:none}
.cbempty{color:var(--muted);font-size:12px;padding:9px 10px;text-align:center}
.cbhint{color:var(--muted);font-size:11px;padding:7px 2px 0;border-top:1px solid var(--border);margin-top:8px}
/* Thanh trên cùng (chỉ hiện trên điện thoại) */
.mtop{display:none;grid-column:1/-1;position:sticky;top:0;z-index:30;align-items:center;gap:10px;background:#080b13f2;backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
.mtop .brand{font-size:17px;padding:0;flex:1;min-width:0}
.mtop .ib{background:#ffffff0d;border:1px solid var(--border);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none;color:var(--text)}
.mtop .ib svg{width:19px;height:19px}
.mtop .ib:active{background:#ffffff1f}
.mtop .msync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mtop .msync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.mtop .msync.on i{background:var(--good)}
.nav button svg{width:18px;height:18px;flex:none}
/* Bảng chi tiết dạng hộp trượt lên */
.sheet-bd{position:fixed;inset:0;background:#02060cc4;backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:430px;max-height:86vh;overflow-y:auto}
.sheet h3{font-size:17px}
.sheet dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px;margin:16px 0 0}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;text-align:right;overflow-wrap:anywhere}
.sheet .btn{width:100%;justify-content:center;margin-top:18px}
.sheet .toolbar .btn{margin-top:0;width:auto}
.sheet .fl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.sheet .fw{width:100%;max-width:none;min-width:0;flex:none}
.sheet .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}
/* Nút cài app (ẩn cho tới khi trình duyệt cho phép cài) */
[data-install][hidden]{display:none!important}
.side .acct button[data-install]{background:#1BB4B422;border-color:#1BB4B455;color:var(--accent);font-weight:600}
.side .acct button[data-install]:hover{background:#1BB4B433}
.mtop .ib[data-install]{color:var(--accent);border-color:#1BB4B455;background:#1BB4B418}
.steps{margin:14px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
.steps li{margin-bottom:6px}
@media (max-width:980px){.grid2,.grid2.b,.grid2.c{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .mtop{display:flex}
  /* Menu trái thành thanh tab dưới đáy */
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:40;flex-direction:row;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);background:#0b1220f5;backdrop-filter:blur(12px)}
  .side .brand,.side .note,.side .acct,.side .live{display:none}
  .nav{flex-direction:row;flex:1;gap:3px}
  .nav button{flex:1;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:11px;padding:7px 2px;min-height:54px;border-radius:12px;text-align:center}
  .nav button[aria-current="page"]{box-shadow:none;background:#1BB4B424;color:var(--accent)}
  main{padding:14px 14px calc(84px + env(safe-area-inset-bottom));max-width:none}
  .top{align-items:flex-start;gap:10px;margin-bottom:14px}
  .top h1{font-size:22px}
  .filters{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px;-webkit-overflow-scrolling:touch}
  .seg{flex:none}
  .seg button{padding:8px 13px;min-height:38px}
  select,.srch,.login-card input{font-size:16px}
  .srch{max-width:none}
  /* Hộp chọn học sinh trượt lên từ đáy cho dễ gõ bằng một tay */
  .cbwrap{flex:1 1 100%}
  .combo{display:flex;flex:1}
  .cbbtn{width:100%;min-width:0;min-height:40px}
  .cbpop{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:74vh;box-shadow:0 -10px 40px #000000aa}
  .cblist{max-height:52vh}
  .cblist button{min-height:44px}
  .card{padding:14px;border-radius:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi .lbl{font-size:12px}
  .kpi .val{font-size:26px;margin:4px 0 2px}
  .kpi .val small{font-size:13px}
  .kpi .dl{font-size:11px}
  .kpi.wide{grid-column:1/-1}
  .badges{grid-template-columns:1fr;gap:10px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stats b{font-size:19px}
  .ringwrap{gap:12px;justify-content:center}
  /* Bảng -> thẻ, không phải kéo ngang */
  .tw{overflow:visible}
  table,thead,tbody{display:block}
  thead{display:none}
  tbody tr{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;background:#ffffff06;padding:11px 13px;margin-bottom:10px}
  tbody tr:last-child{margin-bottom:0}
  tbody tr:hover{background:#ffffff06}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 0;font-size:13px}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;flex:none}
  td.c-name{order:-2;font-size:15px;font-weight:600;padding:0;justify-content:flex-start}
  td.c-code{order:-1;padding:0 0 7px;justify-content:flex-start}
  td.c-act{order:9;margin-top:9px;padding-top:10px;border-top:1px solid #1C3D5E66;justify-content:stretch}
  td.c-name::before,td.c-code::before,td.c-act::before{display:none}
  td.c-act .act{width:100%}
  .act{gap:8px}
  .act button{flex:1;padding:9px 14px;font-size:13px;min-height:40px;justify-content:center;display:inline-flex;align-items:center}
  .foot{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* In báo cáo trên giấy */
@media print{
  body{background:#fff;color:#111}

/* ===== Man chao mung / dang nhap (welcome) ===== */
.wl-aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wl-aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;mix-blend-mode:screen}
.wl-a1{width:62vmax;height:62vmax;top:-22vmax;left:-14vmax;background:radial-gradient(circle,#1BB4B4,transparent 62%);animation:wlD1 24s ease-in-out infinite alternate}
.wl-a2{width:52vmax;height:52vmax;top:28vmax;right:-18vmax;background:radial-gradient(circle,#2f6bff,transparent 62%);animation:wlD2 28s ease-in-out infinite alternate}
.wl-a3{width:40vmax;height:40vmax;bottom:-16vmax;left:16vmax;background:radial-gradient(circle,#13d8c4,transparent 62%);animation:wlD3 20s ease-in-out infinite alternate}
@keyframes wlD1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes wlD2{to{transform:translate(-7vmax,-8vmax) scale(1.1)}}
@keyframes wlD3{to{transform:translate(6vmax,-5vmax) scale(1.2)}}
.wl-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(#ffffff0e 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 38%,#000,transparent);mask-image:radial-gradient(ellipse 70% 55% at 50% 38%,#000,transparent)}
.wl-wrap{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;text-align:center}
.wl-hero{position:relative;width:148px;height:168px;margin-bottom:6px}
.wl-glow{position:absolute;inset:-26%;border-radius:50%;filter:blur(30px);opacity:.4;background:conic-gradient(from 0deg,#1BB4B4,#5B9BFF,#13d8c4,#1BB4B4);animation:wlSpin 9s linear infinite}
.wl-ring{position:absolute;inset:4%;border-radius:50%;border:1px solid #1BB4B433;box-shadow:inset 0 0 40px #1BB4B41f}
.wl-figure{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 6px 20px #1bb4b44d)}
.wl-bone{stroke:url(#wlbg);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.wl-j{fill:#D1FAE5;transform-box:fill-box;transform-origin:center;animation:wlPulse 2.6s ease-in-out infinite}
@keyframes wlPulse{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}
@keyframes wlSpin{to{transform:rotate(360deg)}}
.wl-word{font:800 40px/1 var(--display);letter-spacing:-.5px;margin-top:2px;background:linear-gradient(180deg,#ffffff,#bfeee9);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-badge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:5px 12px;border-radius:99px;background:#1BB4B414;border:1px solid #1BB4B433;color:#9fe9e2;font-size:12.5px;font-weight:600}
.wl-bdot{width:7px;height:7px;border-radius:50%;background:#1BB4B4;box-shadow:0 0 0 0 #1bb4b4aa;animation:wlBeat 2s infinite}
@keyframes wlBeat{0%{box-shadow:0 0 0 0 #1bb4b4aa}70%{box-shadow:0 0 0 8px #1bb4b400}100%{box-shadow:0 0 0 0 #1bb4b400}}
.wl-tag{color:var(--muted);font-size:14px;margin:12px 4px 0;line-height:1.55}
.wl-installwrap{margin-top:4px}
.wl-install{margin:22px auto 0;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;border:0;border-radius:16px;cursor:pointer;font:700 16px var(--display);color:#04121a;background:linear-gradient(135deg,#2ee6cf,#1BB4B4 55%,#149e9e);box-shadow:0 10px 30px #1bb4b455,inset 0 1px 0 #ffffff66;animation:wlCta 3s ease-in-out infinite}
.wl-install:active{transform:translateY(1px) scale(.99)}
.wl-install svg{width:21px;height:21px;color:#04121a}
@keyframes wlCta{0%,100%{box-shadow:0 10px 30px #1bb4b544,inset 0 1px 0 #ffffff66}50%{box-shadow:0 12px 40px #1bb4b477,inset 0 1px 0 #ffffff66}}
.wl-subcta{color:var(--muted);font-size:12.5px;margin:12px 0 0}
.wl-enter{margin-top:14px;background:none;border:0;color:#9fe9e2;font:600 14px var(--body);cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px}
.wl-login{width:100%;max-width:360px;margin:20px auto 0;text-align:left;background:linear-gradient(180deg,#0e2a4aaa,#0e2a4a55);border:1px solid var(--border);border-radius:18px;padding:24px 22px;backdrop-filter:blur(8px);display:none}
.wl-login.wl-show{display:block;animation:wlRise .5s cubic-bezier(.2,.7,.2,1) both}
.wl-login label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.wl-login input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:16px;color:var(--text)}
.wl-login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #1bb4b426}
.wl-login .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1em}
.wl-go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#04121a;font:700 15px var(--display);cursor:pointer}
.wl-go:disabled{opacity:.6;cursor:default}
.wl-hint{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
.wl-rise{opacity:0;animation:wlRise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wlRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wl-d1{animation-delay:.05s}.wl-d2{animation-delay:.18s}.wl-d3{animation-delay:.31s}.wl-d4{animation-delay:.44s}.wl-d5{animation-delay:.57s}
@media (prefers-reduced-motion:reduce){.wl-rise{opacity:1}}

<body>
<div id="root-outer"></div>

<script>
/* =========================================================================
   CẤU HÌNH SUPABASE
   SUPABASE_ANON_KEY là khoá publishable — an toàn để trong mã web, bảo mật
   dựa vào RLS (device insert / teacher read). Không bao giờ dùng service_role.
   ========================================================================= */
const SUPABASE_URL = 'https://ghphefcczrkuumerciey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xcRyiuFhNOm8dAJ0u8NLpg_QAM4oypE';
/* Hiện chỉ có một kiosk. Thêm máy thứ hai thì sửa chỗ này (và cho chọn máy). */
const DEVICE_ID = 'poseai-01';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{persistSession:true, autoRefreshToken:true}
});

/* ===== Hằng số / tiện ích ===== */
const EX={squat:{n:'Squat',c:'var(--c-squat)',hex:'#1BB4B4'},plank:{n:'Plank',c:'var(--c-plank)',hex:'#5B9BFF'},pushup:{n:'Push-up',c:'var(--c-pushup)',hex:'#F2B544'}};
const exKey=e=>String(e||'').toLowerCase().replace(/[^a-z]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Bỏ dấu để gõ "thong" vẫn tìm ra "Thông" */
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const fmt=(v,d=1)=>Number(v).toLocaleString('vi-VN',{maximumFractionDigits:d});
const DAY=864e5;
const VN_TZ='Asia/Ho_Chi_Minh';
function vnParts(iso){
  const d=new Date(iso);
  const day=new Intl.DateTimeFormat('en-CA',{timeZone:VN_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  const hm=new Intl.DateTimeFormat('vi-VN',{timeZone:VN_TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  return {day,hm,ms:Date.parse(day+'T00:00:00Z')};
}
const dm=day=>day.slice(8,10)+'/'+day.slice(5,7);
/* Thời lượng giây -> "5p30" / "45s"; buổi tập cũ chưa có số liệu thì "—" */
const dur=s=>(s==null||s==='')?'—':(s>=60?`${Math.floor(s/60)}p${String(s%60).padStart(2,'0')}`:`${s}s`);
const sumDur=list=>{const v=list.filter(s=>s.dur!=null);return v.length?v.reduce((t,s)=>t+s.dur,0):null};
const avgReps=list=>{const v=list.filter(s=>s.reps!=null);return v.length?v.reduce((t,s)=>t+s.reps,0)/v.length:null};
const avg=a=>a.length?a.reduce((t,s)=>t+s.score,0)/a.length:null;
const cls=s=>s>=80?'good':s>=60?'mid':'low';
const pill=s=>`<span class="pill ${cls(s)}">${s}</span>`;
const exTag=k=>`<span class="tag" style="--c:${(EX[k]||{c:'#888'}).c}">${(EX[k]||{n:k}).n}</span>`;
const topErr=s=>s.errors.length?s.errors.slice().sort((a,b)=>b.count-a.count)[0].name:'Không có lỗi';
const allErrs=s=>s.errors.slice().sort((a,b)=>b.count-a.count);
/* Màn hình nhỏ: biểu đồ vẽ hẹp hơn để chữ không bị co nhỏ khó đọc */
const isMob=()=>window.innerWidth<=760;
const RANGES=[[7,'7 ngày'],[14,'14 ngày'],[30,'30 ngày'],[3650,'Tất cả']];
const rangeLabel=r=>{const f=RANGES.find(x=>x[0]===r);return f?f[1]:r+' ngày'};

/* Tên học sinh (bảng public.students) — tên và mã HS ở 2 cột riêng */
let NAMES={};
const stuName=pid=>NAMES[pid]?esc(NAMES[pid]):'<span style="color:var(--muted)">Chưa đặt tên</span>';
const plainName=pid=>NAMES[pid]||pid;

/* ===== Dữ liệu từ Supabase ===== */
function mapRow(r){
  let errors=r.errors;
  if(typeof errors==='string'){try{errors=JSON.parse(errors)}catch(e){errors=[]}}
  if(!Array.isArray(errors)) errors=[];
  const {day,hm,ms}=vnParts(r.recorded_at);
  return {id:r.uuid,pid:r.profile_id,ex:exKey(r.exercise),score:r.score,errors,day,hm,ms,at:r.recorded_at,sortMs:Date.parse(r.recorded_at),reps:r.reps,dur:r.duration_s};
}
async function fetchSessions(){
  const {data,error}=await sb.from('sessions')
    .select('uuid,device_id,profile_id,exercise,score,errors,recorded_at,reps,duration_s')
    .order('recorded_at',{ascending:false}).limit(5000);
  if(error) throw error;
  return (data||[]).map(mapRow).sort((a,b)=>a.sortMs-b.sortMs);
}
async function fetchStudents(){
  const {data,error}=await sb.from('students').select('profile_id,name');
  if(error) throw error;
  const map={};(data||[]).forEach(r=>{map[r.profile_id]=r.name});
  return map;
}
/* Lệnh đã gửi xuống máy PoseAI — để giáo viên biết lệnh sửa/xoá đã chạy chưa */
async function fetchCommands(){
  const {data,error}=await sb.from('commands')
    .select('id,type,target,payload,created_at,applied_at,result')
    .order('created_at',{ascending:false}).limit(12);
  if(error) throw error;
  return data||[];
}

/* ===== Sửa / xoá từ xa: ghi lệnh vào public.commands để Pi thi hành ===== */
async function sendCmd(type,target,payload){
  const {data}=await sb.auth.getUser();
  const {error}=await sb.from('commands').insert({
    type,target,payload:payload||null,created_by:(data&&data.user)?data.user.email:null
  });
  if(error) throw error;
}
async function delSession(uuid){
  if(!confirm('Xoá buổi tập này?\n\nSẽ xoá trên web ngay, và xoá trên máy PoseAI ở lần đồng bộ tới (tối đa 2 phút).')) return;
  const {error}=await sb.from('sessions').delete().eq('uuid',uuid);
  if(error){ alert('Không xoá được trên web: '+error.message); return }
  try{ await sendCmd('delete_session',uuid) }
  catch(e){ alert('Đã xoá trên web, nhưng chưa gửi được lệnh xoá xuống máy PoseAI: '+e.message) }
  await refreshData();
}
async function delStudent(pid){
  if(!confirm(`Xoá học sinh ${plainName(pid)} (${pid})?\n\nXoá cả hồ sơ và TẤT CẢ buổi tập của học sinh này, trên web lẫn trên máy PoseAI.`)) return;
  const a=await sb.from('sessions').delete().eq('profile_id',pid);
  const b=await sb.from('students').delete().eq('profile_id',pid);
  if(a.error||b.error){ alert('Không xoá được trên web: '+((a.error||b.error).message)); return }
  try{ await sendCmd('delete_profile',pid) }
  catch(e){ alert('Đã xoá trên web, nhưng chưa gửi được lệnh xoá xuống máy PoseAI: '+e.message) }
  if(state.student===pid) state.student=null;
  await refreshData();
}
async function renStudent(pid){
  const name=prompt('Tên mới cho '+pid+':',NAMES[pid]||'');
  if(name===null) return;
  const n=name.trim();
  if(!n){ alert('Tên không được để trống.'); return }
  const {error}=await sb.from('students').update({name:n}).eq('profile_id',pid);
  if(error){ alert('Không đổi được tên trên web: '+error.message); return }
  try{ await sendCmd('rename_profile',pid,n) }
  catch(e){ alert('Đã đổi trên web, nhưng chưa gửi được lệnh xuống máy PoseAI: '+e.message) }
  await refreshData();
}

let S=[], CMDS=[], DATA={profiles:[]}, END=0, NEW_IDS=new Set(), lastSync=null, liveOn=false;
const state={view:'tong-quan',range:14,ex:'all',student:null,fEx:'all',fSt:'all',q:'',sort:'n'};
let rerender=()=>{};

function rebuildProfiles(){
  /* Gộp cả hồ sơ CHƯA có buổi tập nào (lấy từ bảng students), nếu không thì
     học sinh mới thêm — hoặc 15 hồ sơ đồng bộ từ Pi chưa tập — sẽ không hiện ra */
  DATA.profiles=[...new Set(S.map(s=>s.pid).concat(Object.keys(NAMES)))].sort().map(id=>({id}));
  END=S.reduce((m,s)=>s.ms>m?s.ms:m,0);
}
function scope(){
  const from=END-(state.range-1)*DAY, prevFrom=from-state.range*DAY;
  const okEx=s=>state.ex==='all'||s.ex===state.ex;
  return {from,cur:S.filter(s=>s.ms>=from&&okEx(s)),prev:S.filter(s=>s.ms>=prevFrom&&s.ms<from&&okEx(s))};
}

/* ===== Biểu đồ ===== */
function lineChart(pts,id,ref){
  const m=isMob();
  const w=m?380:640,h=m?205:230,L=m?30:34,R=m?12:16,T=16,B=28,iw=w-L-R,ih=h-T-B,n=pts.length;
  const X=i=>L+(n<=1?iw/2:i*iw/(n-1)), Y=v=>T+ih-v/100*ih;
  let g='';
  for(const t of [0,25,50,75,100]) g+=`<line class="grid" x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
  const v=pts.map((p,i)=>p.y==null?null:[X(i),Y(p.y),p]).filter(Boolean);
  if(!v.length) return '<div class="empty">Chưa có buổi tập trong khoảng này.</div>';
  const d=v.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=`${d} L${v[v.length-1][0].toFixed(1)} ${T+ih} L${v[0][0].toFixed(1)} ${T+ih} Z`;
  let refPath='';
  if(ref&&ref.length){
    const rv=ref.map((p,i)=>p.y==null?null:[X(i),Y(p.y)]).filter(Boolean);
    if(rv.length>1) refPath=`<path d="${rv.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#7C93A6" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  }
  const step=Math.max(1,Math.ceil(n/(m?4:7)));
  let xl='';pts.forEach((p,i)=>{if(i%step===0||i===n-1)xl+=`<text class="ax" x="${X(i)}" y="${h-8}" text-anchor="middle">${p.x}</text>`});
  const last=v[v.length-1];
  const dots=v.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${n>40?2:3}" fill="#080b13" stroke="#1BB4B4" stroke-width="1.5"><title>${q[2].x}: ${fmt(q[2].y)} điểm</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ điểm trung bình">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1BB4B4" stop-opacity=".4"/><stop offset="1" stop-color="#1BB4B4" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#g${id})"/>${refPath}<path d="${d}" fill="none" stroke="#1BB4B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#1BB4B4" stroke="#F2FAFA" stroke-width="2"/>
    <text x="${Math.min(last[0],w-R-10)}" y="${last[1]-12}" text-anchor="middle" style="fill:#F2FAFA;font:600 13px var(--body)">${fmt(last[2].y)}</text>${xl}</svg>`;
}
function spark(vals){
  if(vals.length<2) return '<span class="sub">—</span>';
  const w=90,h=24,x=i=>2+i*(w-4)/(vals.length-1),y=v=>h-2-v/100*(h-4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="#1BB4B4" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="2.5" fill="#1BB4B4"/></svg>`;
}
function hbars(items,max){
  if(!items.length) return '<div class="empty">Không có dữ liệu.</div>';
  const m=max||Math.max(...items.map(i=>i.v));
  return items.map(i=>`<div class="hbar"><span class="nm">${esc(i.l)}</span><span class="track"><i style="width:${(i.v/m*100).toFixed(1)}%;background:${i.c}"></i></span><span class="n">${fmt(i.v,0)}</span></div>`).join('');
}
function errAgg(list){
  const m={};
  list.forEach(s=>s.errors.forEach(e=>{const o=m[e.name]||(m[e.name]={v:0,ex:s.ex});o.v+=e.count}));
  return Object.entries(m).map(([l,o])=>({l,v:o.v,c:(EX[o.ex]||{c:'#888'}).c})).sort((a,b)=>b.v-a.v);
}
/* Vòng tròn tiến độ */
function ring(v,label){
  if(v==null) return `<div class="empty" style="width:130px">Chưa có điểm</div>`;
  const r=46,c=2*Math.PI*r;
  const col=v>=80?'#47ce42':v>=60?'#F2B544':'#eb3a3a';
  return `<svg width="130" height="130" viewBox="0 0 120 120" role="img" aria-label="Điểm trung bình ${fmt(v)}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#ffffff12" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-Math.max(0,Math.min(100,v))/100)).toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="60" text-anchor="middle" style="fill:#F2FAFA;font:600 28px var(--display)">${fmt(v,0)}</text>
    <text x="60" y="80" text-anchor="middle" style="fill:#7C93A6;font:500 11px var(--body)">${esc(label)}</text></svg>`;
}
/* Radar 3 bài tập: dữ liệu học sinh (đặc) + trung bình lớp (nét đứt) */
function radar(vals,ref){
  const keys=Object.keys(EX), w=270,h=230,cx=135,cy=112,R=78;
  const ang=i=>-Math.PI/2+i*2*Math.PI/keys.length;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*(v/100),cy+Math.sin(ang(i))*R*(v/100)];
  let g='';
  [33,66,100].forEach(t=>{g+=`<polygon points="${keys.map((k,i)=>pt(i,t).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#ffffff14"/>`});
  keys.forEach((k,i)=>{const p=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#ffffff14"/>`});
  const poly=d=>keys.map((k,i)=>pt(i,d[k]==null?0:d[k]).map(n=>n.toFixed(1)).join(',')).join(' ');
  const refPoly=ref?`<polygon points="${poly(ref)}" fill="none" stroke="#7C93A6" stroke-width="1.6" stroke-dasharray="5 4"/>`:'';
  const labels=keys.map((k,i)=>{const p=pt(i,122);return `<text class="ax" x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" style="fill:${EX[k].hex}">${EX[k].n}</text>`}).join('');
  const dots=keys.map((k,i)=>{const v=vals[k];return v==null?'':`<circle cx="${pt(i,v)[0].toFixed(1)}" cy="${pt(i,v)[1].toFixed(1)}" r="3.5" fill="#1BB4B4"><title>${EX[k].n}: ${fmt(v)} điểm</title></circle>`}).join('');
  return `<svg class="chart" style="max-width:280px" viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ radar theo bài tập">
    ${g}${refPoly}<polygon points="${poly(vals)}" fill="#1BB4B433" stroke="#1BB4B4" stroke-width="2"/>${dots}${labels}</svg>
    <div class="heatlegend"><span style="color:var(--accent)">${SWATCH(false,'currentColor')}Học sinh</span><span>${SWATCH(true,'#7C93A6')}Trung bình lớp</span></div>`;
}
/* Heatmap lịch tập 12 tuần */
function heatmap(list){
  const counts={};
  list.forEach(s=>{counts[s.day]=(counts[s.day]||0)+1});
  const base=END||Date.now();
  const endDow=(new Date(base).getUTCDay()+6)%7;
  const lastMonday=base-endDow*DAY, firstMonday=lastMonday-11*7*DAY;
  const max=Math.max(1,...Object.values(counts));
  let cells='';
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){
    const t=firstMonday+(w*7+d)*DAY;
    const day=new Date(t).toISOString().slice(0,10);
    const n=counts[day]||0;
    const a=n?(0.25+0.75*Math.min(1,n/max)):0;
    cells+=`<i style="background:${n?`rgba(27,180,180,${a.toFixed(2)})`:'#ffffff0d'}" title="${dm(day)}: ${n} buổi"></i>`;
  }
  const lg=[0,.25,.5,.75,1].map(a=>`<i style="background:${a?`rgba(27,180,180,${a})`:'#ffffff0d'}"></i>`).join('');
  return `<div class="heatwrap"><div class="heatdays"><span>T2</span><span></span><span>T4</span><span></span><span>T6</span><span></span><span>CN</span></div>
    <div class="heat">${cells}</div></div>
    <div class="heatlegend">Ít ${lg} Nhiều · 12 tuần gần nhất</div>`;
}
/* Huy hiệu */
function badgeCards(cur){
  const by={};
  cur.forEach(s=>{(by[s.pid]=by[s.pid]||[]).push(s)});
  const arr=Object.entries(by).map(([pid,m])=>{
    m.sort((a,b)=>a.sortMs-b.sortMs);
    const half=Math.floor(m.length/2);
    const d=half?avg(m.slice(half))-avg(m.slice(0,half)):null;
    return {pid,n:m.length,a:avg(m),d};
  });
  if(!arr.length) return '';
  const top=arr.filter(x=>x.n>=2).sort((a,b)=>b.a-a.a)[0];
  const prog=arr.filter(x=>x.n>=4&&x.d!=null&&x.d>0).sort((a,b)=>b.d-a.d)[0];
  const busy=arr.slice().sort((a,b)=>b.n-a.n)[0];
  const card=(ico,bg,fg,lbl,who,meta)=>who?`<div class="card badge"><div class="ico" style="background:${bg};color:${fg}">${ico}</div><div><div class="lbl">${lbl}</div><div class="who">${esc(plainName(who))}</div><div class="meta">${meta}</div></div></div>`:'';
  return `<div class="badges">
    ${card(IC.top,'#F2B54422','var(--mid)','Điểm cao nhất',top&&top.pid,top?`${fmt(top.a)} điểm · ${top.n} buổi`:'')}
    ${card(IC.prog,'#47ce4222','var(--good)','Tiến bộ nhất',prog&&prog.pid,prog?`+${fmt(prog.d)} điểm so với đầu kỳ`:'')}
    ${card(IC.busy,'#1BB4B422','var(--accent)','Chăm nhất',busy&&busy.pid,busy?`${busy.n} buổi trong kỳ`:'')}
  </div>`;
}
/* Bảng xếp hạng */
function rankList(cur){
  const by={};
  cur.forEach(s=>{(by[s.pid]=by[s.pid]||[]).push(s)});
  const arr=Object.entries(by).map(([pid,m])=>({pid,n:m.length,a:avg(m)})).filter(x=>x.n>=1).sort((a,b)=>b.a-a.a).slice(0,6);

}

/* ===== Học sinh cần chú ý ===== */
function attention(cur){
  if(!END) return '';
  const by={};
  cur.forEach(s=>{(by[s.pid]=by[s.pid]||[]).push(s)});
  const items=[];
  DATA.profiles.forEach(p=>{
    const m=(by[p.id]||[]).slice().sort((a,b)=>a.sortMs-b.sortMs);
    if(!m.length) return;
    const days=Math.round((END-m[m.length-1].ms)/DAY);
    if(days>=7){ items.push({pid:p.id,why:`Chưa tập ${days} ngày`,sev:2}); return }
    if(m.length>=4){
      const half=Math.floor(m.length/2);
      const d=avg(m.slice(half))-avg(m.slice(0,half));
      if(d<=-5){ items.push({pid:p.id,why:`Điểm giảm ${fmt(Math.abs(d))} so với đầu kỳ`,sev:1}); return }
    }
    const a=avg(m);
    if(a!=null&&a<60) items.push({pid:p.id,why:`Điểm trung bình ${fmt(a)} — dưới 60`,sev:1});
  });
  if(!items.length) return '';
  items.sort((a,b)=>b.sev-a.sev);
  return `<section class="card" style="margin-bottom:16px"><h2>Cần chú ý</h2><p class="hint">Học sinh nên nhắc tập lại hoặc xem lại tư thế</p>
  <div class="cmds">${items.slice(0,5).map(i=>`<div class="cmd"><span class="ic" style="color:${i.sev===2?'var(--mid)':'var(--bad)'}">${i.sev===2?IC.time:IC.down}</span>
    <span class="t">${esc(plainName(i.pid))}<br><span>${esc(i.why)}</span></span>
    <span class="st"><button class="btn" data-view="hoc-sinh" data-student="${esc(i.pid)}" style="padding:6px 11px;font-size:12px">Xem</button></span></div>`).join('')}</div></section>`;
}

/* ===== Xuất CSV (mở được bằng Excel, có BOM cho tiếng Việt) ===== */
function toCSV(list){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['Ngày','Giờ','Mã HS','Tên học sinh','Bài tập','Điểm','Rep','Thời lượng (giây)','Lỗi chính','Tất cả lỗi'].map(q).join(',')];
  list.forEach(s=>lines.push([s.day,s.hm,s.pid,plainName(s.pid),(EX[s.ex]||{n:s.ex}).n,s.score,
    s.reps==null?'':s.reps,s.dur==null?'':s.dur,topErr(s),
    allErrs(s).map(e=>e.name+' x'+e.count).join('; ')].map(q).join(',')));
  return '﻿'+lines.join('\r\n');
}
function downloadCSV(list,name){
  if(!list.length){ alert('Không có buổi tập nào để xuất.'); return }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([toCSV(list)],{type:'text/csv;charset=utf-8'}));
  a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ===== Thêm hồ sơ học sinh từ web, rồi gửi lệnh xuống máy PoseAI ===== */
function newPid(){
  const used=new Set(DATA.profiles.map(p=>p.id).concat(Object.keys(NAMES)));
  const H='0123456789ABCDEF';
  for(let k=0;k<800;k++){
    let id='HS';
    for(let i=0;i<6;i++) id+=H[Math.floor(Math.random()*16)];
    if(!used.has(id)) return id;
  }
  return 'HS'+String(Date.now()).slice(-6);
}

  const start=cur.length?Math.max(from,Math.min(...cur.map(s=>s.ms))):from;

  if(q) rows=rows.filter(r=>norm(plainName(r.id)+' '+r.id).includes(q));
  const cmp={
    n:(x,y)=>y.n-x.n,
    a:(x,y)=>(y.a==null?-1:y.a)-(x.a==null?-1:x.a),
    name:(x,y)=>plainName(x.id).localeCompare(plainName(y.id),'vi'),
    last:(x,y)=>(y.last?y.last.sortMs:0)-(x.last?x.last.sortMs:0)
  };
  rows.sort(cmp[state.sort]||cmp.n);
  let detail='';
  if(state.student){
    const r=rows.find(x=>x.id===state.student);
    if(r){
      const errs=errAgg(r.m);
      const byExS={},byExC={};

        byExC[k]=avg(cur.filter(s=>s.ex===k));

      <h3 style="font-size:14px;margin:16px 0 10px">Lỗi hay gặp</h3>${hbars(errs.slice(0,5))}
      <div class="toolbar" style="margin:18px 0 0"><button class="btn" data-print type="button">In báo cáo</button>${S.some(s=>s.pid===r.id)?`<button class="btn" data-csv-student="${esc(r.id)}" type="button">Xuất CSV học sinh này</button>`:''}</div></section>`;

  const tbl=rows.length
    ?`<div class="tw"><table><thead><tr><th>Học sinh</th><th>Mã HS</th><th>Số buổi</th><th>Điểm TB</th><th>Xu hướng</th><th>Buổi gần nhất</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr data-student="${esc(r.id)}" class="${state.student===r.id?'sel':''}" tabindex="0"><td class="c-name"><b>${stuName(r.id)}</b></td><td class="code c-code" data-label="Mã HS">${esc(r.id)}</td><td data-label="Số buổi">${r.n}</td><td data-label="Điểm TB">${r.a==null?'—':pill(Math.round(r.a))}</td><td data-label="Xu hướng">${spark(r.m.slice(-8).map(s=>s.score))}</td><td data-label="Buổi gần nhất">${r.last?dm(r.last.day)+' '+r.last.hm:'—'}</td><td class="c-act"><div class="act"><button data-ren-student="${esc(r.id)}" title="Đổi tên">Sửa tên</button><button class="danger" data-del-student="${esc(r.id)}" title="Xoá học sinh và toàn bộ buổi tập">Xoá</button></div></td></tr>`).join('')}</tbody></table></div>`

      <button class="btn pri" id="btnAdd" type="button">${IC.addstu}Thêm học sinh</button>

function studentCombo(){

  S.forEach(s=>{cnt[s.pid]=(cnt[s.pid]||0)+1});
  const cur=state.fSt==='all'?'Tất cả học sinh':plainName(state.fSt);
  const rows=[`<button type="button" role="option" data-pick="all" data-always aria-selected="${state.fSt==='all'}" data-search=""><span>Tất cả học sinh</span><span class="n">${S.length} buổi</span></button>`]
    .concat(DATA.profiles.map(p=>`<button type="button" role="option" data-pick="${esc(p.id)}" aria-selected="${state.fSt===p.id}" data-search="${esc(norm(plainName(p.id)+' '+p.id))}"><span>${stuName(p.id)} <span class="code">${esc(p.id)}</span></span><span class="n">${cnt[p.id]||0} buổi</span></button>`));
  return `<div class="combo">
    <button class="cbbtn" type="button" data-combo-open aria-expanded="false" aria-haspopup="listbox"><span class="cur">${esc(cur)}</span>${IC.caret}</button>
    <div class="cbpop" hidden>
      <input class="srch" id="cbq" type="search" placeholder="Gõ tên hoặc mã HS…" autocomplete="off" aria-label="Tìm học sinh">
      <div class="cblist" role="listbox">${rows.join('')}</div>

      <div class="cbhint">Gõ không dấu vẫn tìm được · Enter chọn kết quả đầu</div>

function comboEls(){
  const c=document.querySelector('.combo');
  return c?{c,btn:c.querySelector('.cbbtn'),pop:c.querySelector('.cbpop'),q:c.querySelector('#cbq'),
            list:c.querySelector('.cblist'),empty:c.querySelector('.cbempty')}:null;
}
function comboFilter(){
  const e=comboEls(); if(!e) return;
  const q=norm(e.q.value).trim();
  let n=0;
  e.list.querySelectorAll('button').forEach(b=>{
    const keep=b.hasAttribute('data-always')||!q||b.dataset.search.includes(q);
    b.hidden=!keep;
    if(keep&&!b.hasAttribute('data-always')) n++;
  });
  e.empty.hidden=!(q&&n===0);
}
function setCombo(open){
  const e=comboEls(); if(!e) return;
  e.pop.hidden=!open;
  e.btn.setAttribute('aria-expanded',open?'true':'false');
  if(open){ e.q.value=''; comboFilter(); e.q.focus() }
}
function filteredSessions(){
  return S.filter(s=>(state.fEx==='all'||s.ex===state.fEx)&&(state.fSt==='all'||s.pid===state.fSt))
          .sort((a,b)=>b.sortMs-a.sortMs);
}
function viewSessions(){
  const all=filteredSessions();
  const total=all.length, list=all.slice(0,100);
  return head('Buổi tập',`${total} buổi khớp bộ lọc${total>100?', hiện 100 buổi mới nhất':''}`)+`
  <section class="card"><div class="toolbar">
    <label>Bài tập <select id="fEx"><option value="all">Tất cả</option>${Object.keys(EX).map(k=>`<option value="${k}" ${state.fEx===k?'selected':''}>${EX[k].n}</option>`).join('')}</select></label>
    <div class="cbwrap"><span>Học sinh</span>${studentCombo()}</div>
    <button class="btn" id="btnCsv" type="button">Xuất CSV (${total} buổi)</button></div>
  ${sessionTable(list,true)}</section>`+foot();
}

/* ===== Hiệu ứng số chạy ===== */
function animateCounts(root){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count); if(isNaN(target)) return;
    const dec=+(el.dataset.dec||0);
    if(reduce){el.textContent=fmt(target,dec);return}
    const t0=performance.now(),dur=650;
    (function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=fmt(target*e,dec);
      if(k<1) requestAnimationFrame(step); else el.textContent=fmt(target,dec);
    })(t0);
  });
}

const SWATCH=(dash,col)=>`<svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true"><path d="M1.4 4h15.2" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round"${dash?' stroke-dasharray="4 3.2"':''}/></svg>`;

let deferredInstall=null;
const isStandalone=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function updateInstallUI(){
  const show=!isStandalone()&&(!!deferredInstall||isIOS());
  document.querySelectorAll('[data-install]').forEach(b=>{b.hidden=!show});
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; updateInstallUI(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; updateInstallUI(); });
async function doInstall(){
  if(deferredInstall){
    const p=deferredInstall; deferredInstall=null;
    try{ p.prompt(); await p.userChoice }catch(_){}
    updateInstallUI();
    return;
  }
  if(isIOS()){
    openSheet(`<h3>Cài PoseAI lên iPhone</h3>

let globalsBound=false;
function renderApp(userEmail){
  const outer=document.getElementById('root-outer');
  outer.innerHTML=`<div class="app">
    <aside class="side">
      <div class="brand">${LOGO}PoseAI</div>
      <nav class="nav" aria-label="Điều hướng">
        <button data-view="tong-quan">${IC.ov}Tổng quan</button>
        <button data-view="hoc-sinh">${IC.stu}Học sinh</button>

      </nav>
      <div class="live"><span class="dot"></span><span data-live>Đang kết nối…</span></div>
      <div class="note">Chỉ hiển thị dữ liệu buổi tập. Không có video hay keypoints.</div>
      <div class="acct"><span class="email">${esc(userEmail)}</span><button data-install type="button" hidden>Cài đặt ứng dụng</button><button data-logout type="button">Đăng xuất</button></div>
    </aside>
    <header class="mtop">
      <div class="brand">${LOGO}PoseAI</div>
      <span class="msync"><i></i><span data-live="short">…</span></span>
      <button class="ib" data-install type="button" hidden aria-label="Cài đặt ứng dụng" title="Cài đặt ứng dụng">${IC.install}</button>
      <button class="ib" data-refresh type="button" aria-label="Làm mới dữ liệu" title="Làm mới">${IC.rf}</button>
      <button class="ib" data-logout type="button" aria-label="Đăng xuất" title="Đăng xuất">${IC.out}</button>
    </header>
    <main id="root"></main>
  </div>`;
  rerender=function(){
    const h=location.hash.replace('#','');
    state.view=VIEWS[h]?h:'tong-quan';
    const root=document.getElementById('root');
    if(!root) return;
    root.innerHTML=VIEWS[state.view]();
    document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false'));
    animateCounts(root);
    syncLabel();
  };
  outer.addEventListener('click',async e=>{
    if(e.target.closest('[data-logout]')){ sb.auth.signOut(); return }
    const rf=e.target.closest('[data-refresh]');
    if(rf){ rf.disabled=true; await refreshData(); rf.disabled=false; return }
    if(e.target.closest('[data-install]')){ doInstall(); return }
    if(e.target.closest('[data-print]')){ window.print(); return }
    if(e.target.closest('#btnAdd')){ addStudentSheet(); return }
    const csv1=e.target.closest('[data-csv-student]');
    if(csv1){
      const pid=csv1.dataset.csvStudent;
      downloadCSV(S.filter(s=>s.pid===pid).sort((a,b)=>b.sortMs-a.sortMs),`poseai_${pid}.csv`);
      return;
    }
    if(e.target.closest('#btnCsv')){
      downloadCSV(filteredSessions(),`poseai_buoitap_${new Date().toISOString().slice(0,10)}.csv`);
      return;
    }
    const info=e.target.closest('[data-ses-info]');
    if(info){ sessionSheet(info.dataset.sesInfo); return }
    if(e.target.closest('[data-combo-open]')){
      const el=comboEls();
      setCombo(el?el.pop.hidden:true);
      return;
    }
    const pick=e.target.closest('[data-pick]');
    if(pick){ state.fSt=pick.dataset.pick; rerender(); return }
    const act=e.target.closest('[data-del-session],[data-del-student],[data-ren-student]');
    if(act){
      e.stopPropagation();
      if(act.dataset.delSession) delSession(act.dataset.delSession);
      else if(act.dataset.delStudent) delStudent(act.dataset.delStudent);
      else renStudent(act.dataset.renStudent);
      return;
    }
    const t=e.target.closest('[data-view],[data-range],[data-ex],[data-student],[data-ses]');
    if(!t) return;
    const st=t.dataset.student;
    if(st) state.student=t.dataset.view?st:(state.student===st?null:st);
    if(t.dataset.view){
      const h=t.dataset.view;
      if(location.hash.replace('#','')===h) rerender(); else location.hash=h;
      return;
    }
    if(t.dataset.ses){ sessionSheet(t.dataset.ses); return }
    if(t.dataset.range) state.range=+t.dataset.range;
    if(t.dataset.ex) state.ex=t.dataset.ex;
    rerender();
  });
  outer.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('tr[data-student],tr[data-ses]')){ e.target.click(); return }
    if(e.target.id!=='cbq') return;
    if(e.key==='Escape'){ e.stopPropagation(); setCombo(false); return }
    if(e.key==='Enter'){
      e.preventDefault();
      const el=comboEls(); if(!el) return;
      const first=[...el.list.querySelectorAll('button')].find(b=>!b.hidden&&!b.hasAttribute('data-always'));
      if(first) first.click();
    }
  });
  outer.addEventListener('change',e=>{
    if(e.target.id==='fEx'){state.fEx=e.target.value;rerender()}
    if(e.target.id==='sortStu'){state.sort=e.target.value;rerender()}
  });
  /* Tìm kiếm: vẽ lại rồi trả con trỏ về ô tìm để gõ tiếp không bị mất nét */
  outer.addEventListener('input',e=>{
    if(e.target.id==='cbq'){ comboFilter(); return }   /* lọc tại chỗ, không vẽ lại cả màn */
    if(e.target.id!=='qStu') return;
    state.q=e.target.value;
    rerender();
    const el=document.getElementById('qStu');
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length) }catch(_){} }
  });
  if(!globalsBound){
    globalsBound=true;
    window.addEventListener('hashchange',()=>rerender());
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); setCombo(false) } });
    /* Bấm ra ngoài thì đóng hộp chọn học sinh */
    document.addEventListener('click',e=>{ if(!e.target.closest('.combo')) setCombo(false) });
    /* Đổi chiều màn hình / co giãn cửa sổ: vẽ lại biểu đồ cho đúng cỡ */
    let wasMob=isMob(), rt=null;
    window.addEventListener('resize',()=>{
      clearTimeout(rt);
      rt=setTimeout(()=>{ if(isMob()!==wasMob){ wasMob=isMob(); rerender() } },200);
    });
  }
  rerender();
  updateInstallUI();
}

/* ===== Realtime + tự làm mới ===== */
let channel=null, pollTimer=null;
function stampSync(){
  lastSync=new Intl.DateTimeFormat('vi-VN',{timeZone:VN_TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
}
function startLive(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('poseai-sessions')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'sessions'},payload=>{
      const row=mapRow(payload.new);
      if(S.some(s=>s.id===row.id)) return;
      S.push(row); S.sort((a,b)=>a.sortMs-b.sortMs);
      rebuildProfiles();
      NEW_IDS.add(row.id);
      setTimeout(()=>{NEW_IDS.delete(row.id)},30000);
      stampSync(); rerender();
    })
    .subscribe(status=>{ liveOn=(status==='SUBSCRIBED'); syncLabel(); });
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(refreshData,60000);
}
async function refreshData(){
  try{
    const [sessions,names,cmds]=await Promise.all([
      fetchSessions(),
      fetchStudents().catch(()=>NAMES),
      fetchCommands().catch(()=>CMDS)
    ]);
    const known=new Set(S.map(s=>s.id));
    sessions.forEach(s=>{if(!known.has(s.id)&&S.length){NEW_IDS.add(s.id);setTimeout(()=>NEW_IDS.delete(s.id),30000)}});
    S=sessions; NAMES=names; CMDS=cmds; rebuildProfiles(); stampSync(); rerender();
  }catch(e){ /* mất mạng tạm thời: giữ nguyên dữ liệu đang hiển thị */ }
}

/* ===== Tải dữ liệu / lỗi ===== */
function renderLoading(){
  document.getElementById('root-outer').innerHTML=`<div class="center-screen"><div style="text-align:center"><div class="spinner"></div><p class="sub">Đang tải dữ liệu buổi tập…</p></div></div>`;
}
function renderLoadError(msg,userEmail){
  document.getElementById('root-outer').innerHTML=`<div class="center-screen"><div class="login-card" style="text-align:center">
    <div class="brand" style="justify-content:center">PoseAI</div>
    <p class="sub">Không tải được dữ liệu từ Supabase.</p>
    <p class="err" style="min-height:auto">${esc(msg)}</p>
    <button id="btnRetry" type="button" style="width:100%;margin-top:14px;background:var(--accent);color:#06141f;font-weight:600;border:0;border-radius:10px;padding:11px">Thử lại</button>
    <button id="btnLogout2" type="button" style="width:100%;margin-top:8px;background:#ffffff0d;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px">Đăng xuất</button>
  </div></div>`;
  document.getElementById('btnRetry').onclick=()=>bootData(userEmail);
  document.getElementById('btnLogout2').onclick=()=>sb.auth.signOut();
}
async function bootData(userEmail){
  renderLoading();
  try{
    const [sessions,names,cmds]=await Promise.all([
      fetchSessions(),
      fetchStudents().catch(()=>({})),
      fetchCommands().catch(()=>[])
    ]);
    S=sessions; NAMES=names; CMDS=cmds;
    rebuildProfiles(); stampSync();
    renderApp(userEmail);
    startLive();
  }catch(err){
    renderLoadError(err.message||String(err),userEmail);
  }
}

        <p class="wl-subcta">Miễn phí · không chiếm bộ nhớ · gỡ lúc nào cũng được</p>
      </div>
      <button class="wl-enter wl-rise wl-d5" id="wlEnter" type="button">Hoặc đăng nhập để vào ngay →</button>

        <input id="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
        <label for="pw">Mật khẩu</label>
        <input id="pw" type="password" required autocomplete="current-password">

        <p class="wl-hint">Tài khoản do quản trị viên tạo trong Supabase Auth.</p>

  const enterBtn=document.getElementById('wlEnter'), card=document.getElementById('loginForm');
  function openForm(){ card.classList.add('wl-show'); enterBtn.style.display='none'; const i=document.getElementById('email'); if(i) i.focus(); try{ card.scrollIntoView({behavior:'smooth',block:'center'}) }catch(_){} }
  enterBtn.addEventListener('click',openForm);
  const wi=document.getElementById('wlInstall'); if(wi) wi.addEventListener('click',doInstall);
  if(prefillErr) openForm();
  card.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('loginBtn'), errEl=document.getElementById('loginErr');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    btn.disabled=true; btn.textContent='Đang đăng nhập…'; errEl.textContent='';
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ errEl.textContent=error.message==='Invalid login credentials'?'Email hoặc mật khẩu không đúng.':error.message; btn.disabled=false; btn.textContent='Đăng nhập'; }
  });
  updateInstallUI();
}

/* ===== Điều phối ===== */
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(session&&session.user){ if(!booted){booted=true;bootData(session.user.email)} }
  else{ booted=false; renderLogin(); }
});
sb.auth.getSession().then(({data})=>{
  if(data&&data.session&&data.session.user){ if(!booted){booted=true;bootData(data.session.user.email)} }
  else{ renderLogin(); }
});
