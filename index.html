<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoseAI Dashboard</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="img/favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#080b13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Bố cục: menu trái + vùng nội dung; tông navy/teal lấy từ style.css của kiosk */
/* Font self-host giống kiosk/Pi: chép nguyên thư mục static/font/ của Pi vào repo (thư mục font/),
   giữ y nguyên tên file. Thiếu file thì tự rơi về Be Vietnam Pro + Outfit nên không vỡ dấu. */
@font-face{
  font-family:'Unbounded';
  src:url('font/Unbounded-Medium.ttf?v=2') format('truetype');
  font-weight:700;font-style:normal;font-display:swap}
@font-face{
  font-family:'SFUHelveticaLight';
  src:url('font/%239Slide03%20SFUHelveticaLight.ttf') format('truetype');
  font-weight:300;font-style:normal;font-display:swap}
@font-face{
  font-family:'CousineBold';
  src:url('font/%239Slide03%20Cousine%20Bold.ttf') format('truetype');
  font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#080b13; --bg2:#0B1220; --surface:#0e2a4a; --surface2:#133758;
  --accent:#1BB4B4; --text:#F2FAFA; --muted:#7C93A6; --border:#1C3D5E;
  --good:#47ce42; --mid:#F2B544; --bad:#eb3a3a;
  --c-squat:#1BB4B4; --c-plank:#5B9BFF; --c-pushup:#F2B544;
  --display:'Unbounded','Outfit','Be Vietnam Pro',sans-serif;
  --body:'SFUHelveticaLight','Be Vietnam Pro',system-ui,sans-serif;
  --mono:'CousineBold',ui-monospace,'SF Mono',Menlo,monospace;
  /* lớp phủ/gradient dùng chung cho card, pill nav, dropdown — tách biến để đổi theo theme.
     Đặc hơn bản cũ (88/44) để bỏ backdrop-filter trên .card mà không bị lộ ảnh nền rối mắt. */
  --grad1:#0e2a4aeb; --grad2:#0e2a4acc;
  --ov-04:#ffffff0a; --ov-06:#ffffff0f; --ov-08:#ffffff14; --ov-12:#ffffff1f; --ov-18:#ffffff26;
  --glow-weak:#1BB4B422; --glow-mid:#1BB4B444;
  --shadow:0 16px 40px -12px #00000080;
  color-scheme:dark;
}
/* Theme sáng — ép buộc qua nút chọn trong dropdown tài khoản */
:root[data-theme="light"]{
  --bg:#eef3f8; --bg2:#f6f9fc; --surface:#ffffff; --surface2:#eef3f8;
  --accent:#0d9488; --text:#0f1c2a; --muted:#5b6b7a; --border:#d7e1ea;
  --good:#188a3e; --mid:#a8710a; --bad:#c62f2f;
  --c-squat:#0d9488; --c-plank:#2563eb; --c-pushup:#a8710a;
  --grad1:#ffffffee; --grad2:#ffffffcc;
  --ov-04:#0f1c2a06; --ov-06:#0f1c2a0a; --ov-08:#0f1c2a10; --ov-12:#0f1c2a18; --ov-18:#0f1c2a22;
  --glow-weak:#0d948822; --glow-mid:#0d948844;
  --shadow:0 16px 40px -14px #0f1c2a33;
  color-scheme:light;
}
/* Theme "hệ thống" — theo prefers-color-scheme của trình duyệt/OS */
@media (prefers-color-scheme:light){
  :root[data-theme="system"]{
    --bg:#eef3f8; --bg2:#f6f9fc; --surface:#ffffff; --surface2:#eef3f8;
    --accent:#0d9488; --text:#0f1c2a; --muted:#5b6b7a; --border:#d7e1ea;
    --good:#188a3e; --mid:#a8710a; --bad:#c62f2f;
    --c-squat:#0d9488; --c-plank:#2563eb; --c-pushup:#a8710a;
    --grad1:#ffffffee; --grad2:#ffffffcc;
    --ov-04:#0f1c2a06; --ov-06:#0f1c2a0a; --ov-08:#0f1c2a10; --ov-12:#0f1c2a18; --ov-18:#0f1c2a22;
    --glow-weak:#0d948822; --glow-mid:#0d948844;
    --shadow:0 16px 40px -14px #0f1c2a33;
    color-scheme:light;
  }
}
html{transition:background-color .2s ease}
body,.card,.login-card{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* Nền lấy từ app kiosk/Pi: ảnh hoạ tiết hình học mờ phủ gradient tối để chữ vẫn đọc rõ.
   Theme sáng không hợp ảnh nền tối nên giữ gradient phẳng như cũ (override bên dưới).
   Dùng pseudo-element position:fixed thay vì background-attachment:fixed trên body: cách cũ
   khiến nhiều trình duyệt di động (đặc biệt WebKit/Safari) vẽ lại toàn bộ nền mỗi khi DOM
   thay đổi (vd. chuyển tab) vì không được đẩy lên lớp compositor riêng như position:fixed —
   đây là nguyên nhân chính khiến chuyển tab bị giật/chậm trên điện thoại. */
body{color:var(--text);font:400 15px/1.5 var(--body);background:var(--bg);position:relative}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,rgba(5,7,12,.3),rgba(5,7,12,.72)),
    radial-gradient(1200px 600px at 80% -10%,var(--glow-weak),transparent 60%),
    url('img/bg.webp') center/cover no-repeat;
}
:root[data-theme="light"] body::before{display:none}
:root[data-theme="light"] body{background:radial-gradient(1200px 600px at 80% -10%,var(--glow-weak),transparent 60%),var(--bg)}
@media (prefers-color-scheme:light){
  :root[data-theme="system"] body::before{display:none}
  :root[data-theme="system"] body{background:radial-gradient(1200px 600px at 80% -10%,var(--glow-weak),transparent 60%),var(--bg)}
}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}

/* ===== Topbar dạng pill (lấy ý từ navbar ASM Learning Platform) ===== */
/* Viền dưới dạng gradient mờ dần 2 đầu, đậm accent ở giữa — hiệu ứng mượn từ .app-header của app Pi */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid transparent;background-image:linear-gradient(color-mix(in srgb,var(--bg2) 88%,transparent),color-mix(in srgb,var(--bg2) 88%,transparent)),linear-gradient(90deg,transparent,var(--accent),transparent);background-origin:border-box;background-clip:padding-box,border-box;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font:700 20px var(--display);flex:none;background:none;border:0;padding:0;text-align:left}
/* Logo trong topbar bấm được → về Tổng quan; không đổi màu khi hover, chỉ phản hồi khi nhấn */
.brand[data-view]{cursor:pointer;transition:transform .1s}
.brand[data-view]:active{transform:scale(.97)}
.brand svg{flex:none}
.brand-mark{height:22px;width:auto;flex:none;display:block}
.brand-word{height:22px;width:auto;flex:none;display:block}
/* Logo tối (mặc định) dùng cho nền tối; logo sáng (file riêng, có gradient navy) dùng cho theme sáng */
.brand-mark-light,.brand-word-light{display:none}
:root[data-theme="light"] .brand-mark-dark,:root[data-theme="light"] .brand-word-dark{display:none}
:root[data-theme="light"] .brand-mark-light,:root[data-theme="light"] .brand-word-light{display:block}
@media (prefers-color-scheme:light){
  :root[data-theme="system"] .brand-mark-dark,:root[data-theme="system"] .brand-word-dark{display:none}
  :root[data-theme="system"] .brand-mark-light,:root[data-theme="system"] .brand-word-light{display:block}
}
.pill-wrap{display:flex;justify-content:center;min-width:0}
.top-pill-wrap{flex:1}
.bottom-pill-wrap{display:none}
.nav-pill{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.pill-btn{--pc:var(--accent);position:relative;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 16px;border-radius:999px;color:var(--muted);font:600 13px var(--display);letter-spacing:.02em;white-space:nowrap;transition:background-color .15s,color .15s,transform .1s}
.pill-btn:active{transform:scale(.93)}
.pill-btn svg{flex:none;width:17px;height:17px;fill:currentColor}
.pill-btn:hover{color:var(--text);background:var(--ov-06)}
.pill-btn[aria-current="page"]{color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 40%,transparent)}
.top-right{display:flex;align-items:center;gap:14px;flex:none}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.live.on .dot{background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 40%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 35%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Avatar + dropdown tài khoản */
.acct-wrap{position:relative}
#avatarBtn{position:relative;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));border:0;display:grid;place-items:center;color:#F2FAFA;font:700 14px var(--display);transition:transform .1s,filter .15s}
#avatarBtn:hover{filter:brightness(1.12)}
#avatarBtn:active{transform:scale(.92)}
/* Vòng sáng xoay quanh avatar — hiệu ứng mượn từ .profile-avatar::before của app Pi */
#avatarBtn::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,var(--border),transparent 50%,var(--border) 80%);z-index:-1;animation:spinRing 5s linear infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}
#acctDropdown{position:absolute;right:0;top:calc(100% + 10px);width:240px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:none;flex-direction:column;gap:2px;z-index:50}
#acctDropdown.open{display:flex}
.acct-user{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.acct-user .nm{font:600 13px var(--display)}
.acct-user .em{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.dd-item{background:none;border:0;text-align:left;padding:9px 12px;border-radius:9px;color:var(--text);font-size:13px;display:flex;align-items:center;gap:9px;transition:background-color .15s,transform .1s}
.dd-item:hover{background:var(--ov-06)}
.dd-item:active{transform:scale(.97)}
.theme-switch{display:flex;gap:4px;background:var(--ov-06);border-radius:10px;padding:3px;margin:6px 2px 2px}
.theme-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:7px 0;border-radius:7px;color:var(--muted);background:none;border:0;transition:background-color .15s,color .15s,transform .1s}
.theme-opt svg{width:15px;height:15px}
.theme-opt:hover{color:var(--text);background:var(--ov-08)}
.theme-opt:active{transform:scale(.88)}
.theme-opt[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.theme-opt[aria-pressed="true"]:hover{background:var(--surface)}
main{padding:28px 32px 48px;min-width:0;max-width:1280px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:28px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.searchbox{position:relative;flex:1;min-width:180px;max-width:280px}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:7px 10px 7px 32px;font-size:13px;color:var(--text);transition:border-color .15s,box-shadow .15s}
.searchbox input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.daterange{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px 8px}
.daterange input{background:none;border:0;color:var(--text);font-size:13px;padding:4px 2px;color-scheme:inherit}
.daterange input:focus{outline:none}
.daterange span{color:var(--muted);font-size:12px}
/* Tiêu đề cột bấm được để sắp xếp bảng */
th.sortable{cursor:pointer;user-select:none;transition:color .15s}
th.sortable:hover{color:var(--text)}
th.sortable .arrow{display:inline-block;margin-left:4px;opacity:.6;font-size:10px}
th.sortable[data-active="true"]{color:var(--accent)}
th.sortable[data-active="true"] .arrow{opacity:1}
/* Phân trang */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;font-size:13px;color:var(--muted)}
.pager button{background:var(--bg2);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;transition:background-color .15s,border-color .15s,transform .1s}
.pager button svg{width:14px;height:14px;fill:currentColor}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:active:not(:disabled){transform:scale(.92)}
.pager button:disabled{opacity:.35;cursor:default}
/* Nút xuất CSV + nút sửa tên inline + nút dạng liên kết (quên mật khẩu) */
.btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,transform .1s}
.btn-outline svg{width:14px;height:14px;fill:currentColor}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-outline:active{transform:scale(.95)}
.name-edit-btn{background:none;border:0;color:var(--muted);width:40px;height:40px;display:inline-grid;place-items:center;border-radius:6px;vertical-align:middle;margin-left:2px;transition:color .15s,background-color .15s}
.name-edit-btn svg{width:18px;height:18px;fill:currentColor}
.name-edit-btn:hover{color:var(--accent);background:var(--ov-06)}
.name-edit-btn.danger:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.name-edit-row{display:flex;align-items:center;gap:4px}
.name-edit-row input{background:var(--bg2);border:1px solid var(--accent);border-radius:7px;padding:4px 7px;font-size:13px;color:var(--text);width:140px}
.link-btn{background:none;border:0;color:var(--accent);font-size:12px;text-decoration:underline;padding:0}
.link-btn:hover{opacity:.8}
.field-msg{font-size:12px;margin-top:6px;min-height:1em}
.field-msg.ok{color:var(--good)}
.field-msg.bad{color:var(--bad)}
/* Thông báo nổi góc màn hình — thay cho alert() của trình duyệt */
#toastWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
@media (max-width:900px){#toastWrap{bottom:calc(100px + env(safe-area-inset-bottom,0px))}}
.toast{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.45;animation:toastIn .22s ease}
.toast.out{animation:toastOut .18s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.toast .ic{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.toast .ic svg{width:13px;height:13px}
.toast.ok .ic{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.toast.error .ic{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.toast.warn .ic{background:color-mix(in srgb,var(--mid) 20%,transparent);color:var(--mid)}
.toast .msg{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.toast .x{background:none;border:0;color:var(--muted);flex:none;padding:0;width:18px;height:18px;display:grid;place-items:center;border-radius:5px}
.toast .x svg{width:11px;height:11px;fill:currentColor}
.toast .x:hover{color:var(--text);background:var(--ov-06)}
/* Dải cảnh báo mất kết nối — hiện ngay dưới thanh điều hướng khi tự làm mới bị lỗi liên tục */
.offline-banner{background:color-mix(in srgb,var(--bad) 14%,var(--bg2));color:var(--text);border-bottom:1px solid color-mix(in srgb,var(--bad) 35%,transparent);padding:9px 20px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;text-align:center}
.offline-banner.hidden{display:none}
.offline-banner .link-btn{white-space:nowrap}
/* Thanh thao tác hàng loạt khi chọn nhiều dòng trong bảng */
.bulkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ov-08);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.bulkbar b{color:var(--text)}
.btn-outline.danger-outline{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-outline.danger-outline:hover{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn-primary.danger{background:var(--bad);color:#fff}
.btn-primary.danger:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 22px -6px color-mix(in srgb,var(--bad) 60%,transparent)}
td.sel-cell,th.sel-cell{width:1%;padding-right:2px}
td.sel-cell input,th.sel-cell input{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
/* Lời chào cá nhân hoá ở Tổng quan */
.greeting{color:var(--accent);font:600 13px var(--display);letter-spacing:.02em;margin:0 0 6px}
/* Danh sách lệnh đồng bộ xuống máy PoseAI + học sinh cần chú ý — dùng chung bố cục dòng */
.cmds{display:flex;flex-direction:column;gap:8px}
.cmd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--ov-06);border:1px solid transparent;border-radius:10px;padding:8px 11px;font-size:13px}
.cmd .ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ov-08)}
.cmd .ic svg{width:15px;height:15px;display:block;fill:currentColor}
.cmd .t{min-width:0;overflow-wrap:anywhere}
.cmd .t span{color:var(--muted);font-size:12px}
.cmd .st{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.cmd.wait{background:color-mix(in srgb,var(--mid) 12%,transparent);border-color:color-mix(in srgb,var(--mid) 30%,transparent)}
.cmd.wait .ic{background:color-mix(in srgb,var(--mid) 20%,transparent)}
.cmd.wait .st{color:var(--mid)}
/* Hộp chọn học sinh gõ tìm được (dùng ở bộ lọc Buổi tập, thay cho <select> cuộn dài) */
.cbwrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.combo{position:relative;display:inline-flex}
.cbbtn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:9px;min-width:185px;justify-content:space-between;text-align:left}
.cbbtn[aria-expanded="true"]{border-color:var(--accent)}
.cbbtn svg{width:13px;height:13px;flex:none;color:var(--muted)}
.cbbtn .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbpop{position:absolute;z-index:50;top:calc(100% + 6px);left:0;width:min(320px,80vw);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.cbpop .searchbox{width:100%;max-width:none;margin-bottom:8px}
.cblist{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto}
.cblist button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:9px;color:var(--text);font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:38px;width:100%}
.cblist button[hidden]{display:none}
.cblist button:hover{background:var(--ov-08)}
.cblist button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.cblist .n{color:var(--muted);font-size:11px;white-space:nowrap;flex:none}
.cbempty{color:var(--muted);font-size:12px;padding:9px 10px;text-align:center}
.cbhint{color:var(--muted);font-size:11px;padding:7px 2px 0;border-top:1px solid var(--border);margin-top:8px}
@media (max-width:900px){
  .cbwrap{flex:1 1 100%}
  .combo{display:flex;flex:1}
  .cbbtn{width:100%;min-width:0}
  .cbpop{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:74vh;box-shadow:0 -10px 40px #000000aa}
}
/* Nút icon tròn dùng chung: làm mới, cài app */
.icon-btn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none;transition:border-color .15s,color .15s,transform .1s}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn:active{transform:scale(.92)}
.icon-btn[disabled]{opacity:.5;cursor:default}
.icon-btn.spin svg{animation:spin .8s linear infinite}
/* Danh sách mô tả (chi tiết buổi tập) */
.modal-box dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px;margin:14px 0 0}
.modal-box dt{color:var(--muted)}
.modal-box dd{margin:0;text-align:right;overflow-wrap:anywhere}
.modal-box.wide{max-width:420px}
.steps{margin:14px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
.steps li{margin-bottom:6px}
/* Modal cài đặt tài khoản */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal-overlay.hidden{display:none}
.modal-box{width:100%;max-width:360px;max-height:calc(100vh - 40px);overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.modal-box h3{font-size:18px;margin-bottom:4px}
.modal-box .sub{margin-bottom:14px}
.modal-box label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.modal-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text)}
.modal-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn-ghost,.modal-actions .btn-primary{width:auto;flex:1}
.seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;color:var(--muted);font-size:13px;transition:background-color .15s,color .15s,transform .1s}
.seg button:hover{color:var(--text);background:var(--ov-06)}
.seg button:active{transform:scale(.92)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.seg button[aria-pressed="true"]:hover{background:var(--surface)}
/* Không dùng backdrop-filter ở đây: .card lặp lại ~15 lần/trang, blur GPU-tốn trên từng cái
   cộng dồn gây giật khi cuộn. Nền đặc hơn (--grad1/--grad2) thay cho blur xuyên thấu. */
.card{background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:0 8px 24px -6px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.18),inset 0 1px 0 var(--ov-04)}
.card h2{font-size:16px;margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font:600 34px/1.15 var(--display);margin:6px 0 2px;font-variant-numeric:tabular-nums;text-shadow:0 0 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.kpi .val small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .dl{font-size:12px;color:var(--muted)}
.dl .up{color:var(--good)} .dl .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.grid2.b{grid-template-columns:1fr 1.5fr}
.grid2.c{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:13px;margin-bottom:10px}
.hbar .nm{overflow-wrap:anywhere}
.track{height:8px;border-radius:99px;background:var(--ov-12);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.hbar .n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.5em;text-align:right}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--ov-08)}
tr.sel{background:var(--glow-weak)}
tr[data-student]{cursor:pointer;transition:background-color .1s}
tr[data-student]:active{background:var(--glow-weak)}
tr.flash{animation:flashrow 3s ease-out 1}
@keyframes flashrow{0%{background:var(--glow-mid)}100%{background:transparent}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.pill.mid{color:var(--mid);border-color:color-mix(in srgb,var(--mid) 35%,transparent);background:color-mix(in srgb,var(--mid) 10%,transparent)}
.pill.low{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
svg text.ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg .grid{stroke:var(--ov-12);stroke-width:1}
.chart{width:100%;height:auto;display:block}
.empty{color:var(--muted);padding:24px 0;text-align:center;font-size:13px}
.detail{margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stats div{background:var(--ov-08);border-radius:10px;padding:10px 12px}
.stats b{display:block;font:600 22px var(--display);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 22%,transparent)}
.stats span{font-size:12px;color:var(--muted)}
select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
.foot{margin-top:28px;color:var(--muted);font-size:12px}
.code{font-family:var(--mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Heatmap lịch tập */
.heat{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:15px;height:15px;border-radius:3px;display:block}
.heatwrap{display:flex;gap:10px;align-items:flex-start}
.heatdays{display:grid;grid-template-rows:repeat(7,15px);gap:4px;font-size:10px;color:var(--muted);padding-top:1px}
.heatlegend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:12px}
.heatlegend i{width:11px;height:11px;border-radius:3px;display:block}
/* Huy hiệu */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.badge{display:flex;gap:14px;align-items:center}
.badge .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.badge .ico svg{width:21px;height:21px}
.badge .who{font:600 15px var(--display);overflow-wrap:anywhere}
.badge .lbl{font-size:12px;color:var(--muted)}
.badge .meta{font-size:12px;color:var(--muted);margin-top:2px}
/* Bảng xếp hạng */
.rank{display:flex;flex-direction:column;gap:8px}
.rank .row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;background:var(--ov-06)}
.rank .pos{font:600 14px var(--display);color:var(--muted);text-align:center}
.rank .row:nth-child(1) .pos{color:#F2B544}
.rank .row:nth-child(2) .pos{color:#cfd8e3}
.rank .row:nth-child(3) .pos{color:#c98a52}
.rank .nm{font-size:13px;overflow-wrap:anywhere}
.ringwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
/* Màn hình đăng nhập / tải / lỗi */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:16px;padding:32px 28px;backdrop-filter:blur(6px)}
.login-card .brand{justify-content:center;margin-bottom:22px;font-size:22px}
.login-card .brand .brand-mark{height:40px}
.login-card .brand .brand-word{height:24px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.login-card input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);outline:none}
.login-card .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1em}
/* Nút dùng chung — nền đặc (CTA chính) và nút viền (phụ), có hover/nhấn rõ ràng */
.btn-primary{width:100%;background:var(--accent);color:#06141f;font-family:var(--display);font-weight:600;border:0;border-radius:10px;padding:11px;font-size:14px;transition:transform .1s,box-shadow .15s,filter .15s}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 22px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-ghost{width:100%;background:var(--ov-06);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:14px;transition:transform .1s,border-color .15s,background-color .15s}
.btn-ghost:hover{border-color:var(--accent);background:var(--ov-08);color:var(--accent)}
.btn-ghost:active{transform:scale(.97)}
.login-card button[type=submit]{margin-top:20px}
.login-card .hint{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--ov-18);border-top-color:var(--accent);animation:spin 0.8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================================
   TRANG GIỚI THIỆU (landing) — thay cho màn đăng nhập trống trước đây.
   Bố cục theo mẫu trang giới thiệu sản phẩm hiện đại: header dính mờ nền,
   hero hai cột, dải số liệu, "cách hoạt động" 3 bước, nhóm bài tập, phần
   dành cho giáo viên, rồi mới tới khung đăng nhập ở cuối trang.
   Dùng toàn biến --* nên tự chạy đúng ở cả giao diện tối lẫn sáng.
   ========================================================================= */
.lp{min-height:100vh;display:flex;flex-direction:column}
/* Gỡ bỏ phần định dạng <main> của bảng điều khiển (lề, chiều rộng tối đa, chỗ chừa
   cho thanh điều hướng đáy) — trang giới thiệu cần các dải nền chạy hết chiều ngang,
   phần giới hạn bề rộng do .lp-wrap đảm nhiệm. */
.lp-main{flex:1;padding:0;max-width:none;margin:0}
.lp-wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}
.lp [id]{scroll-margin-top:86px}
.lp-head{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:11px 24px;background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.lp-head .brand{flex:none}
.lp-nav{display:flex;gap:2px;margin-left:auto}
.lp-nav a{color:var(--muted);text-decoration:none;font:600 13px var(--display);padding:8px 13px;border-radius:999px;transition:color .15s,background-color .15s}
.lp-nav a:hover{color:var(--text);background:var(--ov-06)}
.btn-pill{background:var(--accent);color:#06141f;border:0;border-radius:999px;padding:10px 20px;font:600 13.5px var(--display);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .1s,border-color .15s,background-color .15s}
.btn-pill:hover{filter:brightness(1.08)}
.btn-pill:active{transform:scale(.96)}
.btn-pill svg{width:15px;height:15px;fill:currentColor}
.btn-pill.ghost{background:var(--ov-08);color:var(--text);border:1px solid var(--border)}
.btn-pill.ghost:hover{filter:none;border-color:var(--accent);color:var(--accent);background:var(--ov-12)}
.lp-head .btn-pill{flex:none;margin-left:4px}
/* Hero */
/* Hero có mô hình 3D làm NỀN: model-viewer phủ kín khối hero ở lớp dưới cùng,
   lớp phủ tối nằm giữa, chữ/nút nằm trên cùng và đè lên mô hình. */
.lp-hero{position:relative;isolation:isolate;display:grid;align-items:center;min-height:clamp(560px,76vh,760px);overflow:hidden}
.lp-hero-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 92%,transparent) 26%,color-mix(in srgb,var(--bg) 55%,transparent) 48%,color-mix(in srgb,var(--bg) 12%,transparent) 68%,transparent 84%)}
.lp-hero-copy{position:relative;z-index:2;display:grid;align-items:center;
  padding-block:clamp(38px,6vw,76px);
  /* Không chặn thao tác kéo xoay: cả khối chữ cho chuột/ngón tay "xuyên qua" xuống mô hình,
     chỉ các nút bấm mới nhận sự kiện trở lại. Nhờ vậy vùng kéo gần như là cả khối hero. */
  pointer-events:none}
.lp-hero-copy a,.lp-hero-copy button{pointer-events:auto}
.lp-hero-copy>div{max-width:min(560px,56%)}
.lp-hero h1{font-size:clamp(31px,4.8vw,50px);line-height:1.13;letter-spacing:-.01em;margin-bottom:18px}
.lp-hero h1 em{font-style:normal;color:var(--accent)}
.lp-lead{color:var(--muted);font-size:clamp(14.5px,1.6vw,16.5px);line-height:1.7;margin:0 0 26px;max-width:52ch}
.lp-actions{display:flex;gap:11px;flex-wrap:wrap}
/* Nền đặc hơn + làm mờ hậu cảnh: huy hiệu này nằm đè lên mô hình 3D nên nền quá trong
   sẽ bị chữ lẫn vào thân máy sáng màu phía sau. */
.lp-badge{display:inline-flex;align-items:center;gap:9px;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);font-size:12.5px;color:var(--muted);margin-bottom:20px}
.lp-badge i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;display:block}
/* Khu vực mô hình 3D ở hero + các thẻ kết quả nổi.
   Vùng kéo-xoay được nới rộng hết chiều ngang cột (tràn qua lề .lp-wrap bằng margin âm)
   để dễ thao tác; theo yêu cầu thì ưu tiên vùng kéo rộng, cuộn dọc trên di động vẫn
   giữ được nhờ touch-action:pan-y bên dưới. */
/* Nền trang trí phía sau mô hình: quầng sáng + lưới chấm mờ dần ra rìa */
.lp-hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 55% at 62% 45%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.lp-hero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--ov-12) 1px,transparent 1px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 62% 46%,#000,transparent);
  mask-image:radial-gradient(ellipse 62% 58% at 62% 46%,#000,transparent)}
/* touch-action:pan-y đặt bằng CSS chứ không chỉ bằng thuộc tính của model-viewer —
   thuộc tính đó không đổi thành CSS thật (kiểm tra thấy vẫn là "auto"), mà nếu để auto
   thì trên điện thoại vuốt dọc ngay trên mô hình sẽ bị giữ lại để xoay, không cuộn được trang.
   Dùng visibility thay vì hiệu ứng mờ dần: opacity có transition sẽ kẹt ở 0 nếu đồng hồ
   hoạt ảnh bị tạm dừng (tab ẩn/nền), còn visibility đổi tức thì nên luôn chắc chắn hiện ra. */
/* Thứ tự lớp trong hero: 0 = mô hình 3D (nền), 1 = lớp phủ tối, 2 = chữ/nút, 3 = thẻ nổi.
   Khung mô hình chiếm phần phải của hero (chừa chỗ cho chữ bên trái) — KHÔNG dời bằng
   camera-target, vì khi để bán kính "auto" thì khung hình được canh quanh chính điểm đó,
   dời ngang là mô hình lệch ra khỏi khung và bị cắt (đã đo: lệch -0.04m là chạm mép phải).
   .lp-model-stage KHÔNG đặt z-index: để nó không tạo ngữ cảnh xếp lớp riêng, nhờ vậy thẻ
   nổi bên trong (z-index 3) vẫn nằm trên khối chữ (z-index 2) của hero. */
/* Tăng lề trái để đẩy mô hình lệch sang phải. Thu hẹp bề ngang khung KHÔNG làm máy nhỏ đi
   (cỡ máy bám theo chiều cao khung), chỉ dời tâm khung sang phải — tâm dịch bằng một nửa
   mức tăng của lề trái. */
.lp-model-stage{position:absolute;top:0;bottom:0;right:0;left:clamp(0px,40%,540px)}
.lp-model{position:absolute;inset:0;z-index:0;width:100%;height:100%;background:transparent;touch-action:pan-y;--poster-color:transparent;--progress-bar-color:var(--accent);--progress-mask:transparent;visibility:hidden}
.lp-model.ready{visibility:visible}
/* Nhãn gợi ý chỉ hiện khi mô hình 3D đã dựng xong (dùng bộ chọn anh em ~ nên thẻ này
   phải nằm ngay sau <model-viewer> trong DOM) */
.lp-model-hint{position:absolute;z-index:3;top:calc(50% + 172px);left:calc(50% + 52px);display:none;align-items:center;gap:6px;background:var(--ov-06);border:1px solid var(--border);padding:4px 11px;border-radius:999px;font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none}
.lp-model-hint svg{width:12px;height:12px;fill:currentColor}
.lp-model.ready ~ .lp-model-hint{display:inline-flex}
/* Dải số liệu */
.lp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.lp-stat{background:var(--bg2);padding:19px 16px;text-align:center}
.lp-stat b{display:block;font:600 clamp(19px,4.4vw,25px)/1.2 var(--display);margin-bottom:5px;font-variant-numeric:tabular-nums}
.lp-stat span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
/* Khung mục */
.lp-sec{padding:clamp(52px,7.5vw,100px) 0}
.lp-sec.alt{background:var(--ov-04);border-block:1px solid var(--border)}
.lp-eyebrow{display:inline-block;font:600 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:13px}
.lp-sec-head{text-align:center;max-width:660px;margin:0 auto clamp(30px,4.5vw,52px)}
.lp-sec-head h2{font-size:clamp(23px,3.2vw,33px);line-height:1.26;margin-bottom:12px}
.lp-sec-head p{color:var(--muted);font-size:14.5px;margin:0;line-height:1.65}
.lp-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.lp-card{background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:16px;padding:23px 21px;box-shadow:0 8px 24px -10px rgba(0,0,0,.3)}
.lp-card h3{font-size:16.5px;margin-bottom:9px}
.lp-card p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0}
.lp-step-n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font:600 15px var(--display);margin-bottom:15px}
/* Thẻ bài tập */
.lp-ex{--c:var(--accent);position:relative;overflow:hidden;background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:16px;padding:22px 21px;box-shadow:0 8px 24px -10px rgba(0,0,0,.3)}
.lp-ex::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
/* Icon bài tập là hình người đầy đủ (lấy từ app kiosk) chứ không phải ký hiệu đơn giản,
   nên để ô lớn hơn một chút — hình Plank/Push-up nằm ngang sẽ quá nhỏ nếu bó trong 22px */
.lp-ex .ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);margin-bottom:14px}
.lp-ex .ico svg{width:38px;height:38px;fill:currentColor}
.lp-ex h3{font-size:16.5px;margin-bottom:8px}
.lp-ex > p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 14px}
.lp-ex ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.lp-ex li{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.lp-ex li svg{width:13px;height:13px;fill:var(--c);flex:none;margin-top:3px}
/* Hai cột: tính năng + ảnh xem trước */
.lp-split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4.5vw,52px);align-items:center}
.lp-split h2{font-size:clamp(23px,3.2vw,31px);line-height:1.26;margin-bottom:13px}
.lp-split > div > p.lp-lead{margin-bottom:26px}
.lp-feats{display:flex;flex-direction:column;gap:17px}
.lp-feat{display:flex;gap:14px}
.lp-feat .ico{width:38px;height:38px;border-radius:11px;background:var(--ov-08);color:var(--accent);display:grid;place-items:center;flex:none}
.lp-feat .ico svg{width:18px;height:18px;fill:currentColor}
.lp-feat h3{font-size:14.5px;margin-bottom:4px}
.lp-feat p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
/* Khung xem trước dạng bảng điều khiển thu nhỏ */
.lp-prev{background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 18px 44px -20px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.18)}
.lp-prev-top{display:flex;align-items:center;gap:7px;margin-bottom:14px}
.lp-prev-top i{width:9px;height:9px;border-radius:50%;background:var(--ov-18);display:block}
.lp-prev-top span{margin-left:auto;font-size:11px;color:var(--muted)}
.lp-prev-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.lp-prev-kpi{background:var(--ov-06);border-radius:10px;padding:11px 12px}
.lp-prev-kpi b{display:block;font:600 19px var(--display);font-variant-numeric:tabular-nums}
.lp-prev-kpi span{font-size:10.5px;color:var(--muted)}
.lp-prev-rows{display:flex;flex-direction:column;gap:7px}
.lp-prev-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--ov-06);border-radius:9px;padding:8px 11px;font-size:12px}
.lp-prev-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Khung đăng nhập cuối trang */
.lp-login{padding:clamp(52px,7.5vw,96px) 0;display:grid;place-items:center}
.lp-login .login-card{margin:0}
.lp-login .lp-sec-head{margin-bottom:clamp(24px,3.5vw,36px)}
/* Mục Facebook.
   Hai khung nhúng của Facebook luôn có nền TRẮNG và không nhận được biến màu của trang,
   nên để chúng trong thẻ nền trắng cố định cho ra vẻ chủ ý, thay vì để một mảng trắng
   chói lạc lõng giữa nền tối. */
.lp-fb{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:clamp(18px,2.6vw,30px);align-items:start}
.lp-fb-panel{background:linear-gradient(180deg,var(--grad1),var(--grad2));border:1px solid var(--border);border-radius:16px;padding:22px 21px;box-shadow:0 8px 24px -10px rgba(0,0,0,.3)}
.lp-fb-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lp-fb-brand .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1877F2;flex:none}
.lp-fb-brand .ico svg{width:23px;height:23px;fill:#fff}
.lp-fb-brand b{display:block;font-size:15px;line-height:1.3}
.lp-fb-brand span{font-size:12.5px;color:var(--muted)}
.lp-fb-panel > p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0 0 16px}
.lp-fb-panel .btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}
.lp-fb-panel .btn-primary svg{width:16px;height:16px;fill:currentColor}
.lp-fb-embed{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.lp-fb-embed iframe{display:block;border:0;width:100%}
/* Khung bài đăng cao cố định (khung nhúng dạng iframe thuần không tự co giãn theo nội dung),
   nên vuốt mờ ở đáy để chỗ bị cắt trông như cố ý, kèm liên kết mở bài đầy đủ. */
.lp-fb-post{position:relative}
.lp-fb-post::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58px;pointer-events:none;background:linear-gradient(rgba(255,255,255,0),#fff)}
.lp-fb-side-embed{margin-top:16px}
.lp-fb-note{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.lp-fb-link{display:inline-flex;align-items:center;gap:6px;margin-top:13px;font-size:13px;color:var(--accent);text-decoration:none}
.lp-fb-link:hover{text-decoration:underline}
.lp-fb-link svg{width:13px;height:13px;fill:currentColor}
@media (max-width:860px){ .lp-fb{grid-template-columns:1fr} }
.lp-foot{border-top:1px solid var(--border);padding:24px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.6}
@media (max-width:860px){
  .lp-split{grid-template-columns:1fr}
  .lp-grid3{grid-template-columns:1fr}
  .lp-nav{display:none}
  .lp-head{gap:10px;padding:10px 16px}
  .lp-head .btn-pill{margin-left:auto}
  /* Di động: chia hero thành 2 hàng — hàng 1 cho mô hình, hàng 2 cho chữ.
     Mô hình là Ô LƯỚI (không còn định vị tuyệt đối theo % cố định) nên luôn nhận hết
     phần chiều cao còn thừa sau khi xếp chữ: màn hình nhỏ chữ xuống nhiều dòng thì hero
     tự cao lên, mô hình vẫn giữ được ít nhất 240px chứ không bị chữ ăn mất như trước. */
  /* Hero cao hơn + hàng mô hình tối thiểu lớn hơn => máy hiện to hơn, vì cỡ máy tỉ lệ
     thuận với chiều cao hàng 1 (góc nhìn dọc cố định, không thể kéo máy ảnh lại gần
     mà không có nguy cơ cắt mép ở màn hình hẹp). */
  .lp-hero{min-height:clamp(680px,97vh,900px);text-align:center;
           display:grid;grid-template-rows:minmax(300px,1fr) auto}
  .lp-model-stage{position:relative;grid-row:1;inset:auto;left:auto;right:auto;width:100%;height:100%}
  /* Khối chữ kéo ngược lên đè khoảng 72px vào chân mô hình -> vẫn có hiệu ứng chồng lớp
     nhưng mức đè là CỐ ĐỊNH, không phụ thuộc chiều cao đoạn văn. */
  .lp-hero-copy{grid-row:2;align-self:auto;align-items:end;position:relative;
                margin-top:-72px;padding-bottom:clamp(24px,6vw,42px)}
  .lp-hero-copy>div{max-width:none}
  .lp-hero .lp-lead{margin-inline:auto}
  .lp-hero .lp-actions{justify-content:center}
  /* Lớp phủ chuyển sang bám theo khối chữ (thay cho .lp-hero-scrim phủ cả hero theo %),
     để vùng tối luôn nằm đúng sau chữ dù hàng mô hình cao bao nhiêu. */
  .lp-hero-scrim{display:none}
  .lp-hero-copy::before{content:"";position:absolute;left:0;right:0;top:-48px;bottom:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--bg) 60%,transparent) 32%,color-mix(in srgb,var(--bg) 92%,transparent) 56%,var(--bg) 74%)}
  .lp-hero::before{background:radial-gradient(74% 34% at 50% 27%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%)}
  .lp-hero::after{-webkit-mask-image:radial-gradient(ellipse 74% 30% at 50% 27%,#000,transparent);mask-image:radial-gradient(ellipse 74% 30% at 50% 27%,#000,transparent)}
  /* Hình máy chiếm y 24-74% của hàng 1 — đặt nhãn gợi ý vào dải trống bên dưới, canh giữa */
  .lp-model-hint{top:80%;left:50%;right:auto;bottom:auto;transform:translateX(-50%)}
  .lp-prev-kpis{grid-template-columns:1fr 1fr}
}
/* Máy rất hẹp (<=360px): logo + nút "Đăng nhập" ở header cộng lại vượt quá bề ngang,
   gây cuộn ngang vài px. Thu nhỏ cả hai lại cho vừa. */
@media (max-width:360px){
  .lp-head{padding:10px 12px;gap:8px}
  .lp-head .brand-mark,.lp-head .brand-word{height:18px}
  .lp-head .btn-pill{padding:9px 14px;font-size:12.5px}
}
@media (max-width:900px){
  #topbar{justify-content:space-between;padding:10px 14px;gap:10px}
  .live{display:none}
  main{padding:20px 16px calc(132px + env(safe-area-inset-bottom,0px))}
  .grid2,.grid2.b,.grid2.c,.grid3{grid-template-columns:1fr}

  /* Navbar thứ 2 — thanh điều hướng nổi cố định dưới đáy, to & nổi bật như mẫu bottom-nav của ASM */
  .top-pill-wrap{display:none}
  .bottom-pill-wrap{display:flex;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:auto}
  .bottom-pill-wrap .nav-pill{gap:6px;padding:7px;background:color-mix(in srgb,var(--bg2) 94%,transparent);border:1px solid var(--border);box-shadow:0 18px 40px -10px #000000b0,0 4px 14px -2px #00000080,inset 0 1px 0 var(--ov-04);backdrop-filter:blur(14px)}
  /* Nút ở thanh dưới: bình thường chỉ hiện icon; tab đang mở thì nở rộng ra kèm tên tab.
     Co giãn bằng max-width (0 -> 150px) chứ không dùng mẹo grid 0fr->1fr: mẹo đó chỉ đúng
     với grid-template-ROWS (chiều cao auto), còn cột co giãn nằm trong flex item tự co
     theo nội dung thì 1fr tính ra 0 nên chữ không bao giờ hiện. */
  .bottom-pill-wrap .pill-btn{padding:15px 19px;border-radius:999px;gap:0;transition:background-color .2s,color .2s,transform .1s,box-shadow .2s,padding .25s cubic-bezier(.2,.7,.2,1),gap .25s cubic-bezier(.2,.7,.2,1)}
  .bottom-pill-wrap .pill-btn svg{width:23px;height:23px}
  .bottom-pill-wrap .pill-btn span{display:block;max-width:0;overflow:hidden;font:600 14px var(--display);white-space:nowrap;transition:max-width .25s cubic-bezier(.2,.7,.2,1)}
  .bottom-pill-wrap .pill-btn[aria-current="page"]{background:var(--pc);color:#06141f;gap:9px;padding-right:22px;box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 55%,transparent),0 8px 22px -4px color-mix(in srgb,var(--pc) 75%,transparent)}
  .bottom-pill-wrap .pill-btn[aria-current="page"] span{max-width:150px}
  .bottom-pill-wrap .pill-btn:active{transform:scale(.9)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* In báo cáo học sinh trên giấy */
@media print{
  body{background:#fff;color:#111}
  #topbar,.bottom-pill-wrap,.filters,.foot,.pager,.icon-btn,.name-edit-btn,.live,.acct-wrap,.print-hide,.bulkbar,.sel-cell,.offline-banner,#toastWrap{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  .card{background:#fff;border:1px solid #bbb;break-inside:avoid;box-shadow:none}
  .kpi .val,.stats b,h1,h2,h3{color:#111;text-shadow:none}
  .sub,.hint,.lbl,.dl,.code,span.nm,th{color:#555!important}
  svg text{fill:#333!important}
}
</style>

<body>
<div id="root-outer"></div>
<div id="toastWrap" aria-live="polite"></div>
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3></h3>
    <p class="sub confirm-body"></p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="confirmCancel">Huỷ</button>
      <button type="button" class="btn-primary" id="confirmOk">Xác nhận</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   CẤU HÌNH SUPABASE
   SUPABASE_ANON_KEY là khoá publishable — an toàn để trong mã web, bảo mật
   dựa vào RLS (device insert / teacher read). Không bao giờ dùng service_role.
   ========================================================================= */
const SUPABASE_URL = 'https://ghphefcczrkuumerciey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xcRyiuFhNOm8dAJ0u8NLpg_QAM4oypE';
/* Hiện chỉ có một kiosk. Thêm máy thứ hai thì sửa chỗ này (và cho chọn máy). */
const DEVICE_ID = 'poseai-01';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{persistSession:true, autoRefreshToken:true}
});

/* ===== Theme sáng/tối/hệ thống — áp ngay khi script chạy để tránh nháy sai màu ===== */
const Theme={
  KEY:'poseai-theme',
  get(){ try{ return localStorage.getItem(this.KEY)||'dark' }catch(e){ return 'dark' } },
  apply(mode){
    document.documentElement.setAttribute('data-theme',mode);
    document.querySelectorAll('.theme-opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===mode?'true':'false'));
    /* Ánh sáng mô hình 3D ở trang giới thiệu cũng phải đổi theo (xem applyModelLighting) */
    if(typeof applyModelLighting==='function') applyModelLighting();
  },
  set(mode){
    try{ localStorage.setItem(this.KEY,mode) }catch(e){}
    this.apply(mode);
  },
  init(){ this.apply(this.get()) }
};
Theme.init();

/* ===== Hằng số / tiện ích ===== */
const EX={squat:{n:'Squat',c:'var(--c-squat)',hex:'#1BB4B4'},plank:{n:'Plank',c:'var(--c-plank)',hex:'#5B9BFF'},pushup:{n:'Push-up',c:'var(--c-pushup)',hex:'#F2B544'}};
const exKey=e=>String(e||'').toLowerCase().replace(/[^a-z]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Bỏ dấu tiếng Việt để tìm kiếm không cần gõ dấu */
const normVN=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const searchIcon='<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/><rect x="14.6" y="14.6" width="8" height="2.4" rx="1.2" transform="rotate(45 14.6 14.6)"/></svg>';
const searchBox=(id,ph,val)=>`<div class="searchbox">${searchIcon}<input type="text" id="${id}" placeholder="${ph}" value="${esc(val||'')}" autocomplete="off"></div>`;
const icoDownload='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3H13V13.17L16.59 9.59L18 11L12 17L6 11L7.41 9.59L11 13.17V3Z"/><rect x="4" y="19" width="16" height="2" rx="1"/></svg>';
const icoTrash='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3H15L16 5H20V7H4V5H8L9 3Z"/><path d="M6 9H18L17 20A2 2 0 0 1 15 22H9A2 2 0 0 1 7 20L6 9Z"/></svg>';
const icoPlus='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="11" y="4" width="2" height="16" rx="1"/><rect x="4" y="11" width="16" height="2" rx="1"/></svg>';
const icoEdit='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25ZM20.71 7.04A1 1 0 0 0 20.71 5.63L18.37 3.29A1 1 0 0 0 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04Z"/></svg>';
const icoCheck='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12L3.4 13.4L9 19L21 7L19.6 5.6L9 16.2Z"/></svg>';
const icoX='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.71L12 12.01L5.7 5.71L4.29 7.12L10.59 13.42L4.29 19.72L5.7 21.13L12 14.83L18.3 21.13L19.71 19.72L13.41 13.42L19.71 7.12Z"/></svg>';
const icoChevL='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4.5L8 12L15.5 19.5L17 18L11 12L17 6Z"/></svg>';
const icoInfo='<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14Z"/><circle cx="12" cy="8.3" r="1.15"/><rect x="10.9" y="10.7" width="2.2" height="6.3" rx="1.1"/></svg>';
const icoRefresh='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5a7 7 0 1 0 6.33 4H21l-3-5-3 5h2.1A5 5 0 1 1 12 7V5Z"/></svg>';

/* ===== Thông báo nổi (toast) — thay cho alert() của trình duyệt để không chặn thao tác
   và hợp giao diện tối/sáng của trang. type: 'ok' | 'error' | 'warn' ===== */
let toastSeq=0;
function toast(msg,type){
  type=type||'ok';
  const wrap=document.getElementById('toastWrap');
  if(!wrap) return;
  const id='toast'+(++toastSeq);
  const el=document.createElement('div');
  el.className='toast '+type;
  el.id=id;
  el.innerHTML=`<span class="ic">${type==='ok'?icoCheck:icoAlert}</span><span class="msg">${esc(msg)}</span><button type="button" class="x" aria-label="Đóng">${icoX}</button>`;
  el.querySelector('.x').addEventListener('click',()=>dismissToast(id));
  wrap.appendChild(el);
  setTimeout(()=>dismissToast(id), type==='ok'?3800:6000);
}
function dismissToast(id){
  const el=document.getElementById(id);
  if(!el||el.classList.contains('out')) return;
  el.classList.add('out');
  setTimeout(()=>el.remove(),200);
}
/* ===== Hộp xác nhận tuỳ chỉnh — thay cho confirm()/alert() chặn luồng của trình duyệt.
   Trả Promise<boolean>: true nếu bấm nút chính, false nếu huỷ/bấm ra ngoài/Esc.
   cancelText:null -> chỉ hiện 1 nút (dùng để thay alert() thông thường). ===== */
function openConfirm({title,body,okText,cancelText,danger}){
  okText=okText||'Xác nhận'; cancelText=cancelText===null?null:(cancelText||'Huỷ');
  return new Promise(resolve=>{
    const modal=document.getElementById('confirmModal');
    modal.querySelector('h3').textContent=title||'';
    modal.querySelector('.confirm-body').innerHTML=esc(body||'').replace(/\n/g,'<br>');
    const okBtn=modal.querySelector('#confirmOk'), cancelBtn=modal.querySelector('#confirmCancel');
    okBtn.textContent=okText;
    okBtn.className='btn-primary'+(danger?' danger':'');
    if(cancelText===null){ cancelBtn.hidden=true; } else { cancelBtn.hidden=false; cancelBtn.textContent=cancelText; }
    modal.classList.remove('hidden');
    function cleanup(result){
      modal.classList.add('hidden');
      okBtn.removeEventListener('click',onOk);
      cancelBtn.removeEventListener('click',onCancel);
      modal.removeEventListener('click',onOverlay);
      resolve(result);
    }
    function onOk(){ cleanup(true) }
    function onCancel(){ cleanup(false) }
    function onOverlay(e){ if(e.target===modal) cleanup(false) }
    okBtn.addEventListener('click',onOk);
    cancelBtn.addEventListener('click',onCancel);
    modal.addEventListener('click',onOverlay);
    modal._confirmCancel=onCancel;
    (cancelText===null?okBtn:cancelBtn).focus();
  });
}
/* Sắp xếp danh sách theo cột bấm được trên tiêu đề bảng (vd state.sortStu/{col,dir}) */
function applySort(arr,sortState,getters){
  const g=getters[sortState&&sortState.col];
  if(!g) return arr;
  return arr.slice().sort((a,b)=>{
    const av=g(a), bv=g(b);
    if(av==null&&bv==null) return 0;
    if(av==null) return 1; if(bv==null) return -1;
    const r=typeof av==='string'?av.localeCompare(bv,'vi'):(av-bv);
    return r*sortState.dir;
  });
}
const sortTh=(label,col,sortState)=>{
  const active=sortState.col===col;
  const arrow=active?(sortState.dir===1?'▲':'▼'):'';
  return `<th class="sortable" data-sort="${col}" data-active="${active}">${esc(label)}${arrow?`<span class="arrow">${arrow}</span>`:''}</th>`;
};
/* Xuất bảng ra CSV (UTF-8 BOM để Excel đọc đúng dấu tiếng Việt) */
function exportCSV(filename,headers,rows){
  const q=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[headers.map(q).join(','),...rows.map(r=>r.map(q).join(','))];
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* Ghi lệnh vào public.commands để app.py trên Pi đọc và áp dụng ở lần đồng bộ tới.
   Chỉ GHI lệnh — không throw ra ngoài UI chính, nơi gọi tự quyết định báo lỗi kiểu gì
   (thường là: đã đổi trên web rồi, nhưng chưa chắc gửi được lệnh xuống máy). */
async function sendCmd(type,target,payload){

  const {error}=await sb.from('commands').insert({
    type,target,payload:payload==null?null:String(payload),device_id:DEVICE_ID,
    created_by:(ures&&ures.user)?ures.user.email:null
  });
  if(error) throw error;
}

   (mất mạng, bảng commands chưa có RLS cho phép insert…) thì dữ liệu trên web vẫn đã
   đổi đúng — chỉ báo thêm cho giáo viên biết là máy có thể chưa nhận được lệnh. ===== */
function newPid(){
  const used=new Set(DATA.profiles.map(p=>p.id).concat(Object.keys(NAMES)));
  const H='0123456789ABCDEF';
  for(let k=0;k<800;k++){
    let id='HS';
    for(let i=0;i<6;i++) id+=H[Math.floor(Math.random()*16)];
    if(!used.has(id)) return id;
  }
  return 'HS'+String(Date.now()).slice(-6);
}

   Phải kèm .select() rồi kiểm tra data trả về có rỗng không mới biết chắc đã xoá/thêm thật. */
async function delSession(uuid){
  const ok=await openConfirm({title:'Xoá buổi tập này?',body:'Buổi tập sẽ được xoá ngay trên hệ thống, và xoá trên máy PoseAI ở lần đồng bộ tới.',okText:'Xoá',danger:true});
  if(!ok) return;
  const {data,error}=await sb.from('sessions').delete().eq('uuid',uuid).select();
  if(error){ toast('Không xoá được: '+error.message,'error'); return }
  if(!data||!data.length){ toast('Không xoá được — tài khoản của bạn có thể chưa được cấp quyền xoá.','error'); return }
  try{ await sendCmd('delete_session',uuid) }
  catch(e){ toast('Đã xoá trên hệ thống, nhưng chưa gửi được lệnh xuống máy PoseAI.','warn') }
  toast('Đã xoá buổi tập.','ok');
  await refreshData();
}

}

/* ===== Biểu đồ ===== */
function lineChart(pts,id,ref){
  const w=640,h=230,L=34,R=16,T=16,B=28,iw=w-L-R,ih=h-T-B,n=pts.length;
  const X=i=>L+(n<=1?iw/2:i*iw/(n-1)), Y=v=>T+ih-v/100*ih;
  let g='';
  for(const t of [0,25,50,75,100]) g+=`<line class="grid" x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
  const v=pts.map((p,i)=>p.y==null?null:[X(i),Y(p.y),p]).filter(Boolean);
  if(!v.length) return '<div class="empty">Chưa có buổi tập trong khoảng này.</div>';
  const d=v.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=`${d} L${v[v.length-1][0].toFixed(1)} ${T+ih} L${v[0][0].toFixed(1)} ${T+ih} Z`;
  let refPath='';
  if(ref&&ref.length){
    const rv=ref.map((p,i)=>p.y==null?null:[X(i),Y(p.y)]).filter(Boolean);
    if(rv.length>1) refPath=`<path d="${rv.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#7C93A6" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  }
  const step=Math.max(1,Math.ceil(n/7));
  let xl='';pts.forEach((p,i)=>{if(i%step===0||i===n-1)xl+=`<text class="ax" x="${X(i)}" y="${h-8}" text-anchor="middle">${p.x}</text>`});
  const last=v[v.length-1];
  const dots=v.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${n>40?2:3}" fill="#080b13" stroke="#1BB4B4" stroke-width="1.5"><title>${q[2].x}: ${fmt(q[2].y)} điểm</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ điểm trung bình">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1BB4B4" stop-opacity=".4"/><stop offset="1" stop-color="#1BB4B4" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#g${id})"/>${refPath}<path d="${d}" fill="none" stroke="#1BB4B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#1BB4B4" stroke="var(--text)" stroke-width="2"/>
    <text x="${Math.min(last[0],w-R-10)}" y="${last[1]-12}" text-anchor="middle" style="fill:#F2FAFA;font:600 13px var(--body)">${fmt(last[2].y)}</text>${xl}</svg>`;
}
function spark(vals){
  if(vals.length<2) return '<span class="sub">—</span>';
  const w=90,h=24,x=i=>2+i*(w-4)/(vals.length-1),y=v=>h-2-v/100*(h-4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="#1BB4B4" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="2.5" fill="#1BB4B4"/></svg>`;
}
function hbars(items,max){
  if(!items.length) return '<div class="empty">Không có dữ liệu.</div>';
  const m=max||Math.max(...items.map(i=>i.v));
  return items.map(i=>`<div class="hbar"><span class="nm">${esc(i.l)}</span><span class="track"><i style="width:${(i.v/m*100).toFixed(1)}%;background:${i.c}"></i></span><span class="n">${fmt(i.v,0)}</span></div>`).join('');
}
function errAgg(list){
  const m={};
  list.forEach(s=>s.errors.forEach(e=>{const o=m[e.name]||(m[e.name]={v:0,ex:s.ex});o.v+=e.count}));
  return Object.entries(m).map(([l,o])=>({l,v:o.v,c:(EX[o.ex]||{c:'#888'}).c})).sort((a,b)=>b.v-a.v);
}
/* Vòng tròn tiến độ */
function ring(v,label){
  if(v==null) return `<div class="empty" style="width:130px">Chưa có điểm</div>`;
  const r=46,c=2*Math.PI*r;
  const col=v>=80?'#47ce42':v>=60?'#F2B544':'#eb3a3a';
  return `<svg width="130" height="130" viewBox="0 0 120 120" role="img" aria-label="Điểm trung bình ${fmt(v)}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#ffffff12" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-Math.max(0,Math.min(100,v))/100)).toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="60" text-anchor="middle" style="fill:#F2FAFA;font:600 28px var(--display)">${fmt(v,0)}</text>
    <text x="60" y="80" text-anchor="middle" style="fill:#7C93A6;font:500 11px var(--body)">${esc(label)}</text></svg>`;
}
/* Radar 3 bài tập: dữ liệu học sinh (đặc) + trung bình lớp (nét đứt) */
function radar(vals,ref){
  const keys=Object.keys(EX), w=270,h=230,cx=135,cy=112,R=78;
  const ang=i=>-Math.PI/2+i*2*Math.PI/keys.length;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*(v/100),cy+Math.sin(ang(i))*R*(v/100)];
  let g='';
  [33,66,100].forEach(t=>{g+=`<polygon points="${keys.map((k,i)=>pt(i,t).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#ffffff14"/>`});
  keys.forEach((k,i)=>{const p=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#ffffff14"/>`});
  const poly=d=>keys.map((k,i)=>pt(i,d[k]==null?0:d[k]).map(n=>n.toFixed(1)).join(',')).join(' ');
  const refPoly=ref?`<polygon points="${poly(ref)}" fill="none" stroke="#7C93A6" stroke-width="1.6" stroke-dasharray="5 4"/>`:'';
  const labels=keys.map((k,i)=>{const p=pt(i,122);return `<text class="ax" x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" style="fill:${EX[k].hex}">${EX[k].n}</text>`}).join('');
  const dots=keys.map((k,i)=>{const v=vals[k];return v==null?'':`<circle cx="${pt(i,v)[0].toFixed(1)}" cy="${pt(i,v)[1].toFixed(1)}" r="3.5" fill="#1BB4B4"><title>${EX[k].n}: ${fmt(v)} điểm</title></circle>`}).join('');
  return `<svg class="chart" style="max-width:280px" viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ radar theo bài tập">
    ${g}${refPoly}<polygon points="${poly(vals)}" fill="#1BB4B433" stroke="#1BB4B4" stroke-width="2"/>${dots}${labels}</svg>
    <div class="heatlegend"><span style="color:var(--accent)">━ Học sinh</span><span>┄ Trung bình lớp</span></div>`;
}
/* Heatmap lịch tập 12 tuần */
function heatmap(list){
  const counts={};
  list.forEach(s=>{counts[s.day]=(counts[s.day]||0)+1});
  const base=END||Date.now();
  const endDow=(new Date(base).getUTCDay()+6)%7;
  const lastMonday=base-endDow*DAY, firstMonday=lastMonday-11*7*DAY;
  const max=Math.max(1,...Object.values(counts));
  let cells='';
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){
    const t=firstMonday+(w*7+d)*DAY;
    const day=new Date(t).toISOString().slice(0,10);
    const n=counts[day]||0;
    const a=n?(0.25+0.75*Math.min(1,n/max)):0;
    cells+=`<i style="background:${n?`rgba(27,180,180,${a.toFixed(2)})`:'#ffffff0d'}" title="${dm(day)}: ${n} buổi"></i>`;
  }
  const lg=[0,.25,.5,.75,1].map(a=>`<i style="background:${a?`rgba(27,180,180,${a})`:'#ffffff0d'}"></i>`).join('');
  return `<div class="heatwrap"><div class="heatdays"><span>T2</span><span></span><span>T4</span><span></span><span>T6</span><span></span><span>CN</span></div>
    <div class="heat">${cells}</div></div>
    <div class="heatlegend">Ít ${lg} Nhiều · 12 tuần gần nhất</div>`;
}
/* Huy hiệu */
function badgeCards(cur){
  const by={};
  cur.forEach(s=>{(by[s.pid]=by[s.pid]||[]).push(s)});
  const arr=Object.entries(by).map(([pid,m])=>{
    m.sort((a,b)=>a.sortMs-b.sortMs);
    const half=Math.floor(m.length/2);
    const d=half?avg(m.slice(half))-avg(m.slice(0,half)):null;
    return {pid,n:m.length,a:avg(m),d};
  });
  if(!arr.length) return '';
  const top=arr.filter(x=>x.n>=2).sort((a,b)=>b.a-a.a)[0];
  const prog=arr.filter(x=>x.n>=4&&x.d!=null&&x.d>0).sort((a,b)=>b.d-a.d)[0];
  const busy=arr.slice().sort((a,b)=>b.n-a.n)[0];
  const icoTrophy='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4H17V9C17 11.5 15.2 13.5 13 13.9V16H15.5A1 1 0 0 1 16.5 17V18H7.5V17A1 1 0 0 1 8.5 16H11V13.9C8.8 13.5 7 11.5 7 9V4Z"/><path d="M5 5H7V9C5.9 9 5 8.1 5 7V5Z"/><path d="M19 5H17V9C18.1 9 19 8.1 19 7V5Z"/><rect x="7" y="18" width="10" height="2" rx="1"/></svg>';
  const icoTrend='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="17" rx="1"/></svg>';
  const icoFlame='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9 6 5 10 5 14a7 7 0 0 0 14 0c0-2.5-1-4.5-2.5-6c.3 2-.7 3.5-2 3c.7-3-.5-6-2.5-9Z"/></svg>';
  const card=(ico,bg,fg,lbl,who,meta)=>who?`<div class="card badge"><div class="ico" style="background:${bg};color:${fg}">${ico}</div><div><div class="lbl">${lbl}</div><div class="who">${esc(plainName(who))}</div><div class="meta">${meta}</div></div></div>`:'';
  return `<div class="badges">
    ${card(icoTrophy,'#F2B54422','var(--mid)','Điểm cao nhất',top&&top.pid,top?`${fmt(top.a)} điểm · ${top.n} buổi`:'')}
    ${card(icoTrend,'#47ce4222','var(--good)','Tiến bộ nhất',prog&&prog.pid,prog?`+${fmt(prog.d)} điểm so với đầu kỳ`:'')}
    ${card(icoFlame,'#1BB4B422','var(--accent)','Chăm nhất',busy&&busy.pid,busy?`${busy.n} buổi trong kỳ`:'')}
  </div>`;
}

function rankList(cur){

/* ===== Học sinh cần chú ý ===== */
function attention(cur){
  if(!END) return '';
  const by={};
  cur.forEach(s=>{(by[s.pid]=by[s.pid]||[]).push(s)});
  const items=[];
  DATA.profiles.forEach(p=>{
    const m=(by[p.id]||[]).slice().sort((a,b)=>a.sortMs-b.sortMs);
    if(!m.length) return;
    const days=Math.round((END-m[m.length-1].ms)/DAY);
    if(days>=7){ items.push({pid:p.id,why:`Chưa tập ${days} ngày`,sev:2}); return }
    if(m.length>=4){
      const half=Math.floor(m.length/2);
      const d=avg(m.slice(half))-avg(m.slice(0,half));
      if(d<=-5){ items.push({pid:p.id,why:`Điểm giảm ${fmt(Math.abs(d))} so với đầu kỳ`,sev:1}); return }
    }
    const a=avg(m);
    if(a!=null&&a<60) items.push({pid:p.id,why:`Điểm trung bình ${fmt(a)} — dưới 60`,sev:1});
  });
  if(!items.length) return '';
  items.sort((a,b)=>b.sev-a.sev);
  return `<section class="card" style="margin-bottom:16px"><h2>Cần chú ý</h2><p class="hint">Học sinh nên nhắc tập lại hoặc xem lại tư thế</p>
  <div class="cmds">${items.slice(0,5).map(i=>`<div class="cmd"><span class="ic" style="color:${i.sev===2?'var(--mid)':'var(--bad)'}">${i.sev===2?icoClock:icoDown}</span>
    <span class="t">${esc(plainName(i.pid))}<br><span>${esc(i.why)}</span></span>
    <span class="st"><button type="button" class="btn-outline" data-student="${esc(i.pid)}" style="padding:6px 11px;font-size:12px">Xem</button></span></div>`).join('')}</div></section>`;
}

const filterBar=()=>`<div class="filters">

  <div class="seg" role="group" aria-label="Bài tập"><button data-ex="all" aria-pressed="${state.ex==='all'}">Tất cả</button>${Object.keys(EX).map(k=>`<button data-ex="${k}" aria-pressed="${state.ex===k}">${EX[k].n}</button>`).join('')}</div></div>`;
const head=(t,sub)=>`<div class="top"><div><h1>${t}</h1><p class="sub">${sub}</p></div>${t==='Buổi tập'?'':filterBar()}</div>`;
const foot=()=>`<p class="foot">Dữ liệu buổi tập và học sinh hiển thị theo giờ Việt Nam. Màu điểm: ≥80 tốt, 60–79 trung bình, dưới 60 cần cải thiện.</p>`;

/* ===== Màn hình ===== */
function viewOverview(){
  const {from,to,cur,prev}=scope();
  const a=avg(cur),b=avg(prev);
  const dl=(a!=null&&b!=null)?(()=>{const d=a-b;return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${fmt(Math.abs(d))}</span> so với kỳ trước`})():'Chưa có kỳ trước để so sánh';
  const active=new Set(cur.map(s=>s.pid)).size;
  const errs=errAgg(cur);
  /* Khoảng quá dài (vd. "Tất cả") thì gộp theo tuần cho biểu đồ đỡ rối */
  const byWeek=(to-from)/DAY>45;
  const pts=[];
  if(byWeek){
    for(let t=from;t<=to;t+=7*DAY){
      const e=Math.min(to,t+6*DAY);
      pts.push({x:dm(new Date(t).toISOString().slice(0,10)),y:avg(cur.filter(s=>s.ms>=t&&s.ms<=e))});
    }
  }else{
    for(let t=from;t<=to;t+=DAY){const day=new Date(t).toISOString().slice(0,10);pts.push({x:dm(day),y:avg(cur.filter(s=>s.day===day))})}
  }
  const byEx=Object.keys(EX).map(k=>({l:EX[k].n,v:cur.filter(s=>s.ex===k).length,c:EX[k].c}));
  const recent=cur.slice().sort((x,y)=>y.sortMs-x.sortMs).slice(0,8);
  const heatList=S.filter(s=>state.ex==='all'||s.ex===state.ex);
  const totDur=sumDur(cur);
  const subTxt=state.useCustom&&state.custom.from&&state.custom.to
    ? `Từ ${dm(state.custom.from)} đến ${dm(state.custom.to)}`
    : state.range==='all'
    ? `Toàn bộ dữ liệu, đến ${END?dm(new Date(END).toISOString().slice(0,10)):'—'}`
    : `${state.range} ngày gần nhất, đến ${END?dm(new Date(END).toISOString().slice(0,10)):'—'}`;
  return `<p class="greeting">${greeting()}</p>`+head('Tổng quan',subTxt)+`
  <div class="kpis">
    <div class="card kpi"><div class="lbl">Số buổi tập</div><div class="val">${num(cur.length)}</div><div class="dl">${prev.length} buổi ở kỳ trước</div></div>
    <div class="card kpi"><div class="lbl">Điểm trung bình</div><div class="val">${a==null?'—':num(a,1)}<small> /100</small></div><div class="dl">${dl}</div></div>
    <div class="card kpi"><div class="lbl">Học sinh hoạt động</div><div class="val">${num(active)}<small> /${DATA.profiles.length}</small></div><div class="dl">Có ít nhất một buổi trong kỳ</div></div>
    <div class="card kpi"><div class="lbl">Tổng thời lượng tập</div><div class="val">${totDur==null?'—':num(totDur/60,0)}<small> phút</small></div><div class="dl">${totDur==null?'Buổi tập cũ chưa ghi thời lượng':`${cur.filter(s=>s.dur!=null).length} buổi có số liệu`}</div></div>
    <div class="card kpi"><div class="lbl">Lỗi gặp nhiều nhất</div><div class="val" style="font-size:17px;line-height:1.35;margin-top:10px">${errs.length?esc(errs[0].l):'Không có'}</div><div class="dl">${errs.length?fmt(errs[0].v,0)+' lần ghi nhận':''}</div></div>
  </div>
  <div class="grid2">
    <section class="card"><h2>Điểm trung bình theo ${byWeek?'tuần':'ngày'}</h2><p class="hint">${byWeek?'Khoảng dài nên gộp theo tuần cho dễ đọc':'Trung bình điểm các buổi trong ngày'}</p>${lineChart(pts,'ov')}</section>
    <section class="card"><h2>Số buổi theo bài tập</h2><p class="hint">Trong khoảng đã chọn</p>${hbars(byEx)}</section>
  </div>

  <div class="grid3">
    <section class="card"><h2>Lịch tập của lớp</h2><p class="hint">Càng đậm càng nhiều buổi tập · 12 tuần</p>${heatmap(heatList)}</section>
    <section class="card"><h2>Bảng xếp hạng</h2><p class="hint">Theo điểm trung bình trong kỳ</p>${rankList(cur)}</section>
    <section class="card"><h2>Lỗi thường gặp</h2><p class="hint">Tổng số lần ghi nhận, màu theo bài tập</p>${hbars(errs.slice(0,6))}</section>
  </div>
  <section class="card"><h2>Buổi tập gần đây</h2><p class="hint">Mới nhất ở trên</p>${sessionTable(recent)}</section>`+foot();
}
const SE_GETTERS={sortMs:s=>s.sortMs,name:s=>normVN(plainName(s.pid)),pid:s=>s.pid,ex:s=>EX[s.ex]?EX[s.ex].n:s.ex,score:s=>s.score,reps:s=>s.reps,dur:s=>s.dur};

/* Chi tiết một buổi tập (mở trong modal dùng chung #sessionModal) */
function sessionDetailHTML(id){

  if(!s) return '<p class="sub">Không tìm thấy buổi tập này.</p>';
  const errs=allErrs(s);
  return `<h3>${stuName(s.pid)}</h3>

const STU_GETTERS={name:r=>normVN(plainName(r.id)),id:r=>r.id,n:r=>r.n,a:r=>r.a==null?-1:r.a,last:r=>r.last?r.last.sortMs:-1};
function studentRows(cur){
  let rows=DATA.profiles.map(p=>{
    const m=cur.filter(s=>s.pid===p.id).sort((x,y)=>x.sortMs-y.sortMs);
    return {id:p.id,m,n:m.length,a:avg(m),last:m.length?m[m.length-1]:null};
  });
  rows=applySort(rows,state.sortStu,STU_GETTERS);
  const q=normVN(state.qStu);
  if(q) rows=rows.filter(r=>normVN(plainName(r.id)).includes(q)||normVN(r.id).includes(q));
  return rows;
}
function sessionList(){
  let list=S.filter(s=>(state.fEx==='all'||s.ex===state.fEx)&&(state.fSt==='all'||s.pid===state.fSt));
  const q=normVN(state.qSe);
  if(q) list=list.filter(s=>normVN(plainName(s.pid)).includes(q)||normVN(s.pid).includes(q)||normVN(topErr(s)).includes(q)||normVN(EX[s.ex]?EX[s.ex].n:'').includes(q));
  return applySort(list,state.sortSe,SE_GETTERS);
}

function studentCombo(){

}
function comboEls(){
  const c=document.querySelector('.combo');
  return c?{c,btn:c.querySelector('.cbbtn'),pop:c.querySelector('.cbpop'),q:c.querySelector('#cbq'),
            list:c.querySelector('.cblist'),empty:c.querySelector('.cbempty')}:null;
}
function comboFilter(){
  const e=comboEls(); if(!e) return;
  const q=normVN(e.q.value).trim();
  let n=0;
  e.list.querySelectorAll('button').forEach(b=>{
    const keep=b.hasAttribute('data-always')||!q||b.dataset.search.includes(q);
    b.hidden=!keep;
    if(keep&&!b.hasAttribute('data-always')) n++;
  });
  e.empty.hidden=!(q&&n===0);
}
function setCombo(open){
  const e=comboEls(); if(!e) return;

const SE_PAGE_SIZE=50;
function viewSessions(){
  const allSeIds=new Set(S.map(s=>s.id));
  [...state.selSe].forEach(id=>{ if(!allSeIds.has(id)) state.selSe.delete(id) });

  const pageList=list.slice((state.pageSe-1)*SE_PAGE_SIZE,state.pageSe*SE_PAGE_SIZE);

function animateCounts(root){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count); if(isNaN(target)) return;
    const dec=+(el.dataset.dec||0);
    if(reduce){el.textContent=fmt(target,dec);return}
    const t0=performance.now(),dur=650;
    (function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=fmt(target*e,dec);
      if(k<1) requestAnimationFrame(step); else el.textContent=fmt(target,dec);
    })(t0);
  });
}
