    </div>
  </div>`;
  Theme.apply(Theme.get());
  rerender=function(){
    const parts=location.hash.replace('#','').split('/');
    const h=parts[0];
    state.view=VIEWS[h]?h:'tong-quan';
    state.student=(state.view==='hoc-sinh'&&parts[1])?decodeURIComponent(parts[1]):null;
    const root=document.getElementById('root');
    if(!root) return;
    /* Giữ focus + vị trí con trỏ của ô đang gõ (vd. tìm kiếm) qua lượt render lại,
       vì innerHTML thay toàn bộ node nên input cũ sẽ mất focus nếu không khôi phục */
    const act=document.activeElement;
    const keep=(act&&root.contains(act)&&act.id)?{id:act.id,start:act.selectionStart,end:act.selectionEnd}:null;
    root.innerHTML=VIEWS[state.view]();
    document.querySelectorAll('.pill-btn').forEach(b=>b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false'));
    document.title=(VIEW_TITLES[state.view]||'PoseAI')+' · PoseAI Dashboard';
    animateCounts(root);
    syncLabel();
    if(keep){
      const el=document.getElementById(keep.id);
      if(el){ el.focus(); if(typeof keep.start==='number'&&el.setSelectionRange){ try{el.setSelectionRange(keep.start,keep.end)}catch(e){} } }
    }
  };
  rerender();
  updateInstallUI();
}

/* ===== Gắn sự kiện — CHỈ MỘT LẦN ở top-level, KHÔNG đặt trong renderApp().
   renderApp() có thể chạy lại nhiều lần trong cùng 1 tab (vd. đăng xuất rồi đăng nhập lại
   không tải lại trang) — nếu addEventListener nằm trong đó, mỗi lần gọi sẽ cộng dồn thêm
   1 listener, khiến các thao tác "đảo chiều" như sort bị xử lý 2 lần → tự triệt tiêu nhau. ===== */
outer.addEventListener('click',async e=>{
  /* Bấm vào checkbox chọn dòng không được nổi lên thành chọn/điều hướng cả dòng */
  if(e.target.matches('input[type=checkbox]')) return;
  if(e.target.closest('#bannerRetry')){ refreshData(); return }
  const rfBtn=e.target.closest('#btnRefresh');
  if(rfBtn){
    if(rfBtn.disabled) return;
    rfBtn.disabled=true; rfBtn.classList.add('spin');
    await refreshData();
    rfBtn.disabled=false; rfBtn.classList.remove('spin');
    return;
  }
  if(e.target.closest('#btnLogout')){ sb.auth.signOut(); return }
  if(e.target.closest('[data-install]')){ closeAcctDropdown(); doInstall(); return }
  if(e.target.closest('#btnSettings')){
    closeAcctDropdown();
    const modal=document.getElementById('settingsModal');
    document.getElementById('nameMsg').textContent=''; document.getElementById('nameMsg').className='field-msg';
    document.getElementById('dispNameInput').value=modal.dataset.name||'';
    document.getElementById('pwMsg').textContent='';
    document.getElementById('pwMsg').className='field-msg';
    document.getElementById('curPw').value='';
    document.getElementById('newPw1').value=''; document.getElementById('newPw2').value='';
    modal.classList.remove('hidden');
    return;
  }
  if(e.target.closest('#pwCancel')||e.target.id==='settingsModal'){
    document.getElementById('settingsModal').classList.add('hidden');
    return;
  }
  if(e.target.closest('#nameSave')){
    const btn=document.getElementById('nameSave');
    const modal=document.getElementById('settingsModal');
    const inp=document.getElementById('dispNameInput');
    const name=inp.value.trim();
    const msg=document.getElementById('nameMsg');
    btn.disabled=true; btn.textContent='Đang lưu…';
    sb.auth.updateUser({data:{full_name:name}}).then(({error})=>{
      btn.disabled=false; btn.textContent='Lưu tên hiển thị';
      if(error){ msg.textContent=error.message; msg.className='field-msg bad'; return }
      modal.dataset.name=name;
      TEACHER_NAME=name;
      const nm=document.getElementById('acctName'); if(nm) nm.textContent=name||'Giáo viên';
      const ab=document.getElementById('avatarBtn');
      if(ab) ab.textContent=(name||modal.dataset.email||'?').trim().charAt(0).toUpperCase();
      msg.textContent='Đã lưu tên hiển thị!'; msg.className='field-msg ok';
    });
    return;
  }
  if(e.target.closest('#pwSave')){
    const btn=document.getElementById('pwSave');
    const modal=document.getElementById('settingsModal');
    const p0=document.getElementById('curPw').value;
    const p1=document.getElementById('newPw1').value, p2=document.getElementById('newPw2').value;
    const msg=document.getElementById('pwMsg');
    if(!p0){ msg.textContent='Nhập mật khẩu hiện tại để xác nhận.'; msg.className='field-msg bad'; return }
    if(p1.length<6){ msg.textContent='Mật khẩu mới cần ít nhất 6 ký tự.'; msg.className='field-msg bad'; return }
    if(p1!==p2){ msg.textContent='Hai mật khẩu mới không khớp.'; msg.className='field-msg bad'; return }
    btn.disabled=true; btn.textContent='Đang kiểm tra…';
    /* Supabase updateUser() không tự đòi mật khẩu cũ — tự xác thực lại bằng
       signInWithPassword() với mật khẩu hiện tại trước khi cho đổi, để tránh
       trường hợp máy/trình duyệt bị bỏ quên phiên đăng nhập mà người khác đổi được mật khẩu. */
    sb.auth.signInWithPassword({email:modal.dataset.email,password:p0}).then(({error:authErr})=>{
      if(authErr){
        btn.disabled=false; btn.textContent='Lưu mật khẩu';
        msg.textContent='Mật khẩu hiện tại không đúng.'; msg.className='field-msg bad';
        return;
      }
      btn.textContent='Đang lưu…';
      sb.auth.updateUser({password:p1}).then(({error})=>{
        btn.disabled=false; btn.textContent='Lưu mật khẩu';
        if(error){ msg.textContent=error.message; msg.className='field-msg bad'; return }
        msg.textContent='Đã đổi mật khẩu thành công!'; msg.className='field-msg ok';
        setTimeout(()=>{const m=document.getElementById('settingsModal'); if(m)m.classList.add('hidden')},1200);
      });
    });
    return;
  }
  if(e.target.closest('#btnAddStudent')){
    closeAcctDropdown();
    document.getElementById('adErr').textContent='';
    document.getElementById('adName').value='';
    document.getElementById('adPid').value=newPid();
    document.getElementById('addStuModal').classList.remove('hidden');
    document.getElementById('adName').focus();
    return;
  }
  if(e.target.closest('#adCancel')||e.target.id==='addStuModal'){
    document.getElementById('addStuModal').classList.add('hidden');
    return;
  }
  if(e.target.closest('#adSave')){
    const btn=document.getElementById('adSave');
    const errEl=document.getElementById('adErr');
    const name=document.getElementById('adName').value.trim();
    const id=document.getElementById('adPid').value.trim().toUpperCase();
    errEl.textContent='';
    if(!name){ errEl.textContent='Chưa nhập tên học sinh.'; return }
    if(!/^[A-Z0-9]{3,12}$/.test(id)){ errEl.textContent='Mã HS chỉ gồm chữ in và số, 3–12 ký tự.'; return }
    if(NAMES[id]||DATA.profiles.some(p=>p.id===id)){ errEl.textContent='Mã HS này đã có rồi. Đổi mã khác.'; return }
    btn.disabled=true; btn.textContent='Đang thêm…';
    sb.from('students').insert({profile_id:id,name}).select().then(async({data,error})=>{
      btn.disabled=false; btn.textContent='Thêm học sinh';
      if(error){ errEl.textContent='Không thêm được: '+error.message; return }
      if(!data||!data.length){ errEl.textContent='Không thêm được — tài khoản của bạn có thể chưa được cấp quyền thêm học sinh.'; return }
      document.getElementById('addStuModal').classList.add('hidden');
      let warn=false;
      try{ await sendCmd('create_profile',id,name) }
      catch(e){ warn=true }
      await refreshData();
      toast(warn?'Đã thêm học sinh, nhưng chưa gửi được lệnh xuống máy PoseAI.':'Đã thêm học sinh.', warn?'warn':'ok');
    });
    return;
  }
  const delStuBtn=e.target.closest('[data-del-student]');
  if(delStuBtn){ delStudent(delStuBtn.dataset.delStudent); return }
  const delSeBtn=e.target.closest('[data-del-session]');
  if(delSeBtn){ delSession(delSeBtn.dataset.delSession); return }
  const infoBtn=e.target.closest('[data-ses-info]');
  if(infoBtn){
    document.getElementById('sessionModalBody').innerHTML=sessionDetailHTML(infoBtn.dataset.sesInfo);
    document.getElementById('sessionModal').classList.remove('hidden');
    return;
  }
  if(e.target.id==='sessionModal'){ document.getElementById('sessionModal').classList.add('hidden'); return }
  const themeBtn=e.target.closest('.theme-opt');
  if(themeBtn){ Theme.set(themeBtn.dataset.theme); return }
  if(e.target.closest('[data-combo-open]')){
    const el=comboEls();
    setCombo(el?el.pop.hidden:true);
    return;
  }
  const pickBtn=e.target.closest('[data-pick]');
  if(pickBtn){ state.fSt=pickBtn.dataset.pick; state.pageSe=1; rerender(); return }
  if(!e.target.closest('.combo')) setCombo(false);
  if(e.target.closest('#avatarBtn')){
    const dd=document.getElementById('acctDropdown');
    const open=dd.classList.toggle('open');
    document.getElementById('avatarBtn').setAttribute('aria-expanded',open?'true':'false');
    return;
  }
  if(!e.target.closest('#acctDropdown')) closeAcctDropdown();

  /* Sửa tên học sinh — click trong input không được nổi lên thành chọn dòng */
  if(e.target.closest('.name-edit-row')&&!e.target.closest('[data-save-name]')&&!e.target.closest('[data-cancel-name]')) return;
  const editBtn=e.target.closest('[data-edit-name]');
  if(editBtn){
    state.editId=editBtn.dataset.editName; rerender();
    const inp=document.getElementById('editNameInput');
    if(inp){ inp.focus(); inp.select(); }
    return;
  }
  if(e.target.closest('[data-cancel-name]')){ state.editId=null; rerender(); return }
  const saveBtn=e.target.closest('[data-save-name]');
  if(saveBtn){
    const id=saveBtn.dataset.saveName;
    const inp=document.getElementById('editNameInput');
    const name=inp?inp.value.trim():'';
    const errEl=document.getElementById('stuSaveErr');
    if(!name){ if(errEl) errEl.textContent='Tên không được để trống.'; return }
    saveBtn.disabled=true;
    sb.from('students').upsert({profile_id:id,name}).select().then(async({data,error})=>{
      saveBtn.disabled=false;
      if(error){ if(errEl) errEl.textContent='Không lưu được — '+error.message; return }
      if(!data||!data.length){ if(errEl) errEl.textContent='Không lưu được — tài khoản của bạn có thể chưa được cấp quyền sửa.'; return }
      NAMES[id]=name; state.editId=null; rerender();
      try{ await sendCmd('rename_profile',id,name); toast('Đã đổi tên học sinh.','ok') }
      catch(e){ toast('Đã đổi tên trên hệ thống, nhưng chưa gửi được lệnh xuống máy PoseAI.','warn') }
    });
    return;
  }

  /* Xuất CSV */
  if(e.target.closest('#btnExportStu')){
    const rows=studentRows(scope().cur);
    exportCSV('poseai-hoc-sinh.csv',['Học sinh','Mã HS','Số buổi','Điểm TB','Buổi gần nhất'],
      rows.map(r=>[plainName(r.id),r.id,r.n,r.a==null?'':fmt(r.a),r.last?(dm(r.last.day)+' '+r.last.hm):'']));
    return;
  }
  if(e.target.closest('#btnExportSe')){
    const list=sessionList();
    exportCSV('poseai-buoi-tap.csv',['Thời gian','Học sinh','Mã HS','Bài tập','Điểm','Rep','Thời lượng (giây)','Lỗi chính','Tất cả lỗi'],
      list.map(s=>[dm(s.day)+' '+s.hm,plainName(s.pid),s.pid,EX[s.ex]?EX[s.ex].n:s.ex,s.score,s.reps==null?'':s.reps,s.dur==null?'':s.dur,topErr(s),allErrs(s).map(e=>e.name+' x'+e.count).join('; ')]));
    return;
  }
  const csvStuBtn=e.target.closest('[data-csv-student]');
  if(csvStuBtn){
    const pid=csvStuBtn.dataset.csvStudent;
    const list=S.filter(s=>s.pid===pid).sort((a,b)=>b.sortMs-a.sortMs);
    exportCSV(`poseai_${pid}.csv`,['Thời gian','Học sinh','Mã HS','Bài tập','Điểm','Rep','Thời lượng (giây)','Lỗi chính','Tất cả lỗi'],
      list.map(s=>[dm(s.day)+' '+s.hm,plainName(s.pid),s.pid,EX[s.ex]?EX[s.ex].n:s.ex,s.score,s.reps==null?'':s.reps,s.dur==null?'':s.dur,topErr(s),allErrs(s).map(e=>e.name+' x'+e.count).join('; ')]));
    return;
  }
  if(e.target.closest('[data-print]')){ window.print(); return }

  /* Thao tác hàng loạt trên dòng đã chọn */
  const bulkClear=e.target.closest('[data-bulk-clear]');
  if(bulkClear){
    (bulkClear.dataset.bulkClear==='stu'?state.selStu:state.selSe).clear();
    rerender(); return;
  }
  const bulkCsv=e.target.closest('[data-bulk-csv]');
  if(bulkCsv){
    if(bulkCsv.dataset.bulkCsv==='stu'){
      const rows=studentRows(scope().cur).filter(r=>state.selStu.has(r.id));
      exportCSV('poseai-hoc-sinh-da-chon.csv',['Học sinh','Mã HS','Số buổi','Điểm TB','Buổi gần nhất'],
        rows.map(r=>[plainName(r.id),r.id,r.n,r.a==null?'':fmt(r.a),r.last?(dm(r.last.day)+' '+r.last.hm):'']));
    }else{
      const list=sessionList().filter(s=>state.selSe.has(s.id));
      exportCSV('poseai-buoi-tap-da-chon.csv',['Thời gian','Học sinh','Mã HS','Bài tập','Điểm','Rep','Thời lượng (giây)','Lỗi chính','Tất cả lỗi'],
        list.map(s=>[dm(s.day)+' '+s.hm,plainName(s.pid),s.pid,EX[s.ex]?EX[s.ex].n:s.ex,s.score,s.reps==null?'':s.reps,s.dur==null?'':s.dur,topErr(s),allErrs(s).map(e=>e.name+' x'+e.count).join('; ')]));
    }
    return;
  }
  const bulkDel=e.target.closest('[data-bulk-del]');
  if(bulkDel){
    if(bulkDel.dataset.bulkDel==='stu') bulkDeleteStudents([...state.selStu]);
    else bulkDeleteSessions([...state.selSe]);
    return;
  }

  /* Sắp xếp cột bảng */
  const sortHead=e.target.closest('[data-sort]');
  if(sortHead){
    const col=sortHead.dataset.sort;
    const key=state.view==='hoc-sinh'?'sortStu':'sortSe';
    const cs=state[key];
    state[key]=(cs.col===col)?{col,dir:-cs.dir}:{col,dir:1};
    if(key==='sortSe') state.pageSe=1;
    rerender();
    return;
  }
  /* Phân trang */
  const pageBtn=e.target.closest('[data-page]');
  if(pageBtn){
    if(pageBtn.disabled) return;
    state.pageSe+=pageBtn.dataset.page==='next'?1:-1;
    rerender();
    return;
  }

  const t=e.target.closest('[data-view],[data-range],[data-ex],[data-student]');
  if(!t) return;
  if(t.dataset.view){location.hash=t.dataset.view;return}
  if(t.dataset.range){
    if(t.dataset.range==='custom'){ state.useCustom=true; }
    else if(t.dataset.range==='all'){ state.useCustom=false; state.range='all'; }
    else{ state.useCustom=false; state.range=+t.dataset.range; }
  }
  if(t.dataset.ex) state.ex=t.dataset.ex;
  if(t.dataset.student){
    const id=t.dataset.student;
    location.hash=state.student===id?'hoc-sinh':('hoc-sinh/'+encodeURIComponent(id));
    rerender();
    return;
  }
  rerender();
});
outer.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-student]'))e.target.click();
  if(e.key==='Enter'&&(e.target.id==='curPw'||e.target.id==='newPw1'||e.target.id==='newPw2')){ const b=document.getElementById('pwSave'); if(b)b.click(); }
  if(e.key==='Enter'&&e.target.id==='dispNameInput'){ e.preventDefault(); const b=document.getElementById('nameSave'); if(b)b.click(); }
  if(e.key==='Enter'&&e.target.id==='editNameInput'){ e.preventDefault(); const b=document.querySelector('[data-save-name]'); if(b)b.click(); }
  if(e.key==='Enter'&&(e.target.id==='adName'||e.target.id==='adPid')){ e.preventDefault(); const b=document.getElementById('adSave'); if(b)b.click(); }
  if(e.target.id==='cbq'){
    if(e.key==='Escape'){ e.stopPropagation(); setCombo(false); return }
    if(e.key==='Enter'){
      e.preventDefault();
      const el=comboEls(); if(!el) return;
      const first=[...el.list.querySelectorAll('button')].find(b=>!b.hidden&&!b.hasAttribute('data-always'));
      if(first) first.click();
    }
    return;
  }
  if(e.key==='Escape'){
    closeAcctDropdown();
    const m=document.getElementById('settingsModal'); if(m)m.classList.add('hidden');
    const m2=document.getElementById('addStuModal'); if(m2)m2.classList.add('hidden');
    const m3=document.getElementById('sessionModal'); if(m3)m3.classList.add('hidden');
    setCombo(false);
    if(state.editId){ state.editId=null; rerender(); }
  }
});
outer.addEventListener('change',e=>{
  if(e.target.id==='fEx'){state.fEx=e.target.value;state.pageSe=1;rerender()}
  if(e.target.id==='dFrom'){state.custom.from=e.target.value;rerender()}
  if(e.target.id==='dTo'){state.custom.to=e.target.value;rerender()}
  if(e.target.id==='selAllStu'){
    const ids=(e.target.dataset.ids||'').split(',').filter(Boolean);
    ids.forEach(id=>e.target.checked?state.selStu.add(id):state.selStu.delete(id));
    rerender(); return;
  }
  if(e.target.matches('[data-sel-stu]')){
    const id=e.target.dataset.selStu;
    e.target.checked?state.selStu.add(id):state.selStu.delete(id);
    rerender(); return;
  }
  if(e.target.id==='selAllSe'){
    const ids=(e.target.dataset.ids||'').split(',').filter(Boolean);
    ids.forEach(id=>e.target.checked?state.selSe.add(id):state.selSe.delete(id));
    rerender(); return;
  }
  if(e.target.matches('[data-sel-se]')){
    const id=e.target.dataset.selSe;
    e.target.checked?state.selSe.add(id):state.selSe.delete(id);
    rerender(); return;
  }
});
outer.addEventListener('input',e=>{
  if(e.target.id==='cbq'){ comboFilter(); return }
  if(e.target.id==='qStu'){state.qStu=e.target.value;rerender()}
  if(e.target.id==='qSe'){state.qSe=e.target.value;state.pageSe=1;rerender()}
});
/* Bọc trong arrow function thay vì truyền thẳng `rerender`: addEventListener chụp lại
   giá trị hàm NGAY LÚC gọi — lúc này rerender còn là placeholder rỗng (renderApp() chưa
   chạy lần nào), truyền thẳng sẽ mãi mãi gọi vào bản rỗng đó dù sau này rerender được gán
   lại hàm thật. Bọc arrow function để mỗi lần hashchange sẽ đọc giá trị MỚI NHẤT của biến. */
window.addEventListener('hashchange',()=>rerender());
/* #confirmModal nằm ngoài #root-outer (để dùng được cả ở màn đăng nhập) nên phải
   lắng nghe Esc ở cấp document — nếu gắn vào outer thì sự kiện sẽ không bao giờ
   nổi bọt qua được vì confirmModal không phải là con cháu của outer. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const m=document.getElementById('confirmModal');
  if(m&&!m.classList.contains('hidden')&&m._confirmCancel) m._confirmCancel();
});

/* ===== Realtime + tự làm mới ===== */
let channel=null, pollTimer=null;
function showOfflineBanner(show){
  netOffline=show;
  const el=document.getElementById('offlineBanner');
  if(el) el.classList.toggle('hidden',!show);
}
function stampSync(){
  lastSync=new Intl.DateTimeFormat('vi-VN',{timeZone:VN_TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
}
function startLive(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('poseai-sessions')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'sessions'},payload=>{
      const row=mapRow(payload.new);
      if(S.some(s=>s.id===row.id)) return;
      S.push(row); S.sort((a,b)=>a.sortMs-b.sortMs);
      rebuildProfiles();
      NEW_IDS.add(row.id);
      setTimeout(()=>{NEW_IDS.delete(row.id)},30000);
      stampSync(); rerender();
    })
    .subscribe(status=>{ liveOn=(status==='SUBSCRIBED'); syncLabel(); });
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(refreshData,60000);
}
async function refreshData(){
  try{
    const [sessions,names,cmds]=await Promise.all([
      fetchSessions(),fetchStudents().catch(()=>NAMES),fetchCommands().catch(()=>CMDS)
    ]);
    const known=new Set(S.map(s=>s.id));
    sessions.forEach(s=>{if(!known.has(s.id)&&S.length){NEW_IDS.add(s.id);setTimeout(()=>NEW_IDS.delete(s.id),30000)}});
    S=sessions; NAMES=names; CMDS=cmds; rebuildProfiles(); stampSync(); rerender();
    if(netOffline) showOfflineBanner(false);
  }catch(e){ showOfflineBanner(true); }
}

/* ===== Tải dữ liệu / lỗi ===== */
function renderLoading(){
  document.getElementById('root-outer').innerHTML=`<div class="center-screen"><div style="text-align:center"><div class="spinner"></div><p class="sub">Đang tải dữ liệu buổi tập…</p></div></div>`;
}
function renderLoadError(msg,user){
  document.getElementById('root-outer').innerHTML=`<div class="center-screen"><div class="login-card" style="text-align:center">
    <div class="brand" style="justify-content:center">
      <img class="brand-mark brand-mark-dark" src="img/logo.svg" alt="">
      <img class="brand-mark brand-mark-light" src="img/logo-light.svg" alt="">
      <img class="brand-word brand-word-dark" src="img/logo-text.svg" alt="PoseAI">
      <img class="brand-word brand-word-light" src="img/logo-text-light.svg" alt="PoseAI">
    </div>
    <p class="sub">Không tải được dữ liệu buổi tập. Vui lòng kiểm tra kết nối mạng và thử lại.</p>
    <p class="err" style="min-height:auto">${esc(msg)}</p>
    <button id="btnRetry" type="button" class="btn-primary" style="margin-top:14px">Thử lại</button>
    <button id="btnLogout2" type="button" class="btn-ghost" style="margin-top:8px">Đăng xuất</button>
  </div></div>`;
  document.getElementById('btnRetry').onclick=()=>bootData(user);
  document.getElementById('btnLogout2').onclick=()=>sb.auth.signOut();
}
async function bootData(user){
  renderLoading();
  try{
    const [sessions,names,cmds]=await Promise.all([
      fetchSessions(),fetchStudents().catch(()=>({})),fetchCommands().catch(()=>[])
    ]);
    S=sessions; NAMES=names; CMDS=cmds;
    rebuildProfiles(); stampSync();
    renderApp(user);
    startLive();
  }catch(err){
    renderLoadError(err.message||String(err),user);
  }
}

/* Nạp thư viện <model-viewer> (chỉ ở trang giới thiệu, không đụng tới bảng điều khiển).
   Tải theo yêu cầu bằng import động; chặn CDN / mất mạng thì bắt lỗi và bỏ trống khu vực
   thay vì treo, vì không còn hình SVG tạm nữa. */
const MODEL_VIEWER_SRC='https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js';
let modelLibLoading=null;
function loadModelLib(){
  if(window.customElements&&customElements.get('model-viewer')) return Promise.resolve();
  if(!modelLibLoading) modelLibLoading=import(MODEL_VIEWER_SRC);
  return modelLibLoading;
}
/* Lắc nhẹ qua lại quanh góc 3/4 mặt trước, thay cho auto-rotate xoay trọn vòng (xoay trọn
   vòng thì quá nửa thời gian trang chủ chỉ thấy lưng máy). Dừng hẳn khi người xem tự kéo. */
const SWAY_CENTER=45, SWAY_RANGE=13, SWAY_PERIOD=9000, SWAY_PHI=72;
function startSway(mv){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let stop=false, t0=null;
  const halt=()=>{ stop=true };
  /* Người xem chạm/kéo vào mô hình là dừng lắc, nhường quyền điều khiển cho họ */
  mv.addEventListener('pointerdown',halt,{once:true});
  mv.addEventListener('wheel',halt,{once:true,passive:true});
  function step(t){
    if(stop||!mv.isConnected) return;
    if(t0===null) t0=t;
    const theta=SWAY_CENTER+SWAY_RANGE*Math.sin((t-t0)/SWAY_PERIOD*2*Math.PI);
    /* Góc dọc và bán kính phải là HẰNG SỐ, tuyệt đối không đọc lại từ getCameraOrbit().
       Hàm đó trả về vị trí camera đang nội suy (luôn trễ hơn đích), nên lấy giá trị trễ
       đó đặt làm đích mới sẽ tạo vòng lặp phản hồi khiến góc dọc trôi dần — đo thực tế
       thấy tụt từ 75deg về 0deg, tức là cúi thẳng từ trên xuống. */
    mv.cameraOrbit=`${theta.toFixed(2)}deg ${SWAY_PHI}deg auto`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* Lăn chuột trơn = cuộn trang như bình thường; giữ Ctrl + lăn mới phóng to mô hình.
   Cảm ứng giữ nguyên mặc định của model-viewer: một ngón xoay, hai ngón chụm–mở để phóng to.

   Cách chặn: ở pha capture, nếu KHÔNG giữ Ctrl thì stopPropagation() để sự kiện không
   xuống tới canvas của model-viewer (nhưng vẫn không preventDefault, nên trang cuộn bình thường).
   Không dùng thuộc tính disable-zoom bật/tắt theo sự kiện: đã đo và thấy việc đổi thuộc tính
   KHÔNG kịp áp dụng cho chính sự kiện đang chạy, làm mất nấc lăn đầu tiên. */
function setupZoomGate(mv){
  mv.addEventListener('wheel',e=>{ if(!e.ctrlKey) e.stopPropagation() },{capture:true});
  /* Pha bubble, chạy SAU khi model-viewer đã xử lý xong: chặn phím tắt phóng to CẢ TRANG
     của trình duyệt. Không chặn ở pha capture vì model-viewer bỏ qua mọi sự kiện wheel
     đã bị preventDefault (đã kiểm chứng). */
  mv.addEventListener('wheel',e=>{ if(e.ctrlKey) e.preventDefault() },{passive:false});
}
/* Ánh sáng mô hình đổi theo theme.
   Ảnh môi trường navy tối hợp với nền tối, nhưng ở giao diện sáng (nền #eef3f8) thì khối
   máy xám xịt và vùng sáng dưới chân máy biến thành vệt tối bẩn. Nên ở theme sáng: đổi
   sang ảnh phòng chụp nền trắng, và hạ hẳn mặt sàn xuống thành bóng đổ mờ (tắt phần tự
   phát sáng, giảm độ đục) — trên nền sáng thì bóng đổ mới là thứ đọc ra "có mặt sàn",
   chứ không phải quầng sáng. */
let GROUND_EMISSIVE_DARK=[0.22,0.38,0.40];   // giá trị gốc trong file, đọc lại lúc load
const MODEL_LIGHTING={
  dark :{ env:'model/studio.hdr',       exposure:'1.12', groundAlpha:1.00, groundEmissive:null },
  light:{ env:'model/studio-light.hdr', exposure:'1.00', groundAlpha:0.55, groundEmissive:[0,0,0] }
};
function effectiveTheme(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t==='light'||t==='dark') return t;
  return window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}
function applyModelLighting(){
  const mv=document.getElementById('heroModel');
  if(!mv) return;
  const cfg=MODEL_LIGHTING[effectiveTheme()];
  if(mv.getAttribute('environment-image')!==cfg.env) mv.setAttribute('environment-image',cfg.env);
  mv.setAttribute('exposure',cfg.exposure);
  /* Vật liệu chỉ truy cập được sau khi mô hình tải xong; hàm này được gọi lại ở sự kiện load. */
  const mat=mv.model&&mv.model.materials&&mv.model.materials.find(m=>m.name==='ground');
  if(!mat) return;
  /* baseColorFactor NHÂN với texture nên chỉ làm tối/mờ đi được, không làm sáng lên —
     vừa đủ để hạ độ đục của đĩa ở theme sáng mà không phải dựng thêm file mô hình thứ hai. */
  mat.pbrMetallicRoughness.setBaseColorFactor([1,1,1,cfg.groundAlpha]);
  mat.setEmissiveFactor(cfg.groundEmissive||GROUND_EMISSIVE_DARK);
}
function initHeroModel(){
  const mv=document.getElementById('heroModel');
  if(!mv) return;
  mv.addEventListener('load',()=>{
    const mat=mv.model&&mv.model.materials&&mv.model.materials.find(m=>m.name==='ground');
    /* Lưu lại giá trị gốc trong file để lúc quay về theme tối thì trả đúng như cũ */
    if(mat) GROUND_EMISSIVE_DARK=mat.emissiveFactor.slice(0,3);
    applyModelLighting();
    mv.classList.add('ready');
    startSway(mv);
  },{once:true});
  setupZoomGate(mv);
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyModelLighting);
  loadModelLib().catch(()=>{ mv.remove() });
}

/* ===== Mục Facebook ở trang giới thiệu =====
   Không lấy được "bài đăng mới nhất" một cách tự động: việc đó cần Graph API kèm Page

   muốn đổi bài thì dán đường dẫn bài mới vào đúng hằng số này. */
const FB_PAGE_URL='https://www.facebook.com/profile.php?id=61596450144170';
const FB_POST_URL='https://www.facebook.com/permalink.php?story_fbid=pfbid0FMitFzCQAq2mMPwvXhmVrm4fRTavQQdtVmGtTisNXmnZi8CK6K4MUUS9LZiNgPzWl&id=61596450144170';
const FB_POST_HEIGHT=520;
const icoFacebook='<svg viewBox="0 0 24 24"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.5-3.91 3.77-3.91 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.45 2.91h-2.33V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>';

/* Khung nhúng của Facebook dựng nội dung theo tham số width, KHÔNG co theo khung chứa,
   nên phải tự tính bề rộng rồi mới gắn src — để iframe rộng 100% mà width sai thì bài
   đăng bị lệch, chừa một dải trắng bên phải. Tính lại khi đổi kích thước cửa sổ, nhưng
   chỉ khi lệch đáng kể, vì mỗi lần đổi src là tải lại cả khung. */
function initFacebookEmbeds(){
  const page=document.getElementById('fbPageEmbed');
  const post=document.getElementById('fbPostEmbed');
  if(!page||!post) return;
  const enc=encodeURIComponent;
  /* Giới hạn của chính Facebook: khung bài đăng 350-750px, khung trang 180-500px. */
  const POST_MIN=350, POST_MAX=750, PAGE_MIN=180, PAGE_MAX=500;
  let lastW=0;
  const build=()=>{
    const box=post.parentElement.clientWidth;
    const w=Math.round(Math.max(POST_MIN,Math.min(POST_MAX,box)));
    const pw=Math.round(Math.max(PAGE_MIN,Math.min(PAGE_MAX,page.parentElement.clientWidth)));
    /* Màn hình hẹp hơn 350px: Facebook không dựng nhỏ hơn thế được, nên thu nhỏ cả khung
       bằng transform rồi hạ chiều cao khung bọc theo đúng tỉ lệ — nếu không sẽ thò ra
       ngoài mép phải và làm cả trang cuộn ngang. */
    const k=box<POST_MIN?box/POST_MIN:1;
    post.style.width=w+'px';
    post.style.transformOrigin='top left';
    post.style.transform=k<1?'scale('+k.toFixed(4)+')':'';
    post.parentElement.style.height=k<1?Math.round(FB_POST_HEIGHT*k)+'px':'';
    if(Math.abs(w-lastW)<24 && lastW) return;
    lastW=w;
    /* Kiểu đầu trang gọn (ảnh đại diện, nút Theo dõi và số người theo dõi trên CÙNG một
       hàng) cần khoảng 320px mới đủ; hẹp hơn thì Facebook cắt mất chữ "người theo dõi".
       Dưới ngưỡng đó chuyển sang kiểu xếp dọc — cao hơn nhưng không bị cụt chữ. */
    const slim=pw>=320;
    page.height=slim?70:150;
    page.src='https://www.facebook.com/plugins/page.php?href='+enc(FB_PAGE_URL)+
      '&tabs=&width='+pw+'&height='+(slim?70:150)+'&small_header='+slim+
      '&adapt_container_width=true&hide_cover=true&show_facepile=false&locale=vi_VN';
    post.src='https://www.facebook.com/plugins/post.php?href='+enc(FB_POST_URL)+
      '&show_text=true&width='+w+'&locale=vi_VN';
  };
  build();
  let t=null;
  window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(build,300) });
}

    <main class="lp-main" id="top">
        <section class="lp-hero">
          <!-- Mô hình nằm ở lớp dưới cùng, trải hết bề ngang làm nền cho cả khối hero;
               chữ và nút nằm đè lên trên (xem .lp-hero-copy). -->
            <!-- Mô hình đã nén Draco (2,5MB -> 151KB), model-viewer tự tải bộ giải mã.
                 camera-orbit 45deg: góc 3/4 thấy rõ màn hình và cạnh bên, mặt máy hướng về phía
                 chữ bên trái. Mặt trước là 0deg, 135-225deg là lưng (chỉ có lưới tản nhiệt).
                 Không bật auto-rotate: tự xoay trọn vòng thì quá nửa thời gian hiện mặt lưng —
                 thay bằng startSway() lắc nhẹ quanh 45deg, dừng khi người xem tự kéo.
                 Ánh sáng: ảnh HDR tự dựng (model/studio.hdr, 256x128, 66KB) pha theo đúng tông nền
                 navy/teal của trang: đèn chính trắng ngả ấm chếch trên - trước - trái, đèn viền
                 xanh lam phía sau - phải, đèn phụ lạnh bên phải và một chút sáng hất từ dưới lên.
                 Bản HDR studio trắng dùng trước đó cho ánh sáng sạch nhưng lạc tông, khối máy bị
                 bệt; bản này tách khối rõ hơn và ăn nhập với nền.
                 Vật liệu: bản xuất từ Blockbench để mọi vật liệu roughness = 1 (tán xạ hoàn toàn)
                 nên không bắt sáng; build-model đặt lại theo từng chất liệu (màn kính 0.10, vỏ
                 0.45, chi tiết 0.50, viền sáng 0.55).
                 shadow-intensity = 0: bóng dựng sẵn của model-viewer sẽ ẩn mất mặt phẳng nền ta
                 tự thêm (đã kiểm chứng: bật lên thì mesh "ground" bị đặt visible = false). Mặt
                 phẳng đã có sẵn bóng tiếp xúc bệt vào texture nên không cần bóng của thư viện.
                 Bán kính để "auto": model-viewer tự tính khoảng cách vừa khít mô hình ở MỌI góc
                 xoay và mọi tỉ lệ khung, nên không bao giờ bị cắt mép.
                 camera-target hạ xuống một chút để máy nhích lên giữa khung.
                 touch-action="pan-y" để trên điện thoại vuốt dọc trên mô hình vẫn cuộn được trang. -->
          <!-- Các thẻ nổi nằm CHUNG khung .lp-model-stage với mô hình, nên toạ độ % của chúng
               tính theo vùng mô hình chứ không theo cả hero — trước đây neo vào mép hero nên bị
               đẩy ra xa, tách rời khỏi máy. -->
          <div class="lp-model-stage">
            <model-viewer id="heroModel" class="lp-model" src="model/poseai.glb"
              alt="Mô hình 3D máy PoseAI" camera-controls
              camera-orbit="45deg 72deg auto" camera-target="0m 0.062m -0.02m" field-of-view="30deg"
              environment-image="model/studio.hdr" tone-mapping="commerce" exposure="1.12"
              shadow-intensity="0"
              interaction-prompt="none" loading="eager" reveal="auto"
              touch-action="pan-y" disable-tap></model-viewer>
            <span class="lp-model-hint">${icoRefresh}Kéo để xoay</span>
          </div>
          <!-- Lớp phủ tối để chữ đè lên mô hình vẫn đọc rõ -->
          <div class="lp-hero-scrim"></div>
          <div class="lp-wrap lp-hero-copy">
            <div>
              <span class="lp-badge"><i></i>Đang chạy tại phòng tập thể chất</span>
              <h1>Chấm điểm <em>tư thế tập luyện</em> bằng AI, ngay tại chỗ</h1>
              <p class="lp-lead">PoseAI quan sát học sinh qua camera, đếm số lần, phát hiện lỗi tư thế và chấm điểm từng buổi tập — rồi gửi thẳng kết quả lên bảng theo dõi của giáo viên.</p>
              <div class="lp-actions">
                <a class="btn-pill" href="#dang-nhap">Đăng nhập để xem lớp</a>
                <a class="btn-pill ghost" href="#cach-hoat-dong">Xem cách hoạt động</a>
              </div>
            </div>
          </div>
        </section>
        <div class="lp-wrap">
        <section class="lp-stats" aria-label="Số liệu">
          <div class="lp-stat"><b>3</b><span>bài tập được hỗ trợ</span></div>
          <div class="lp-stat"><b>Tự động</b><span>chấm điểm ngay khi tập xong</span></div>
          <div class="lp-stat"><b>Vài giây</b><span>kết quả hiện trên bảng theo dõi</span></div>
          <div class="lp-stat"><b>0</b><span>video hay hình ảnh được lưu</span></div>
        </section>
      </div>

      <section class="lp-sec alt" id="cach-hoat-dong">
        <div class="lp-wrap">
          <div class="lp-sec-head">
            <span class="lp-eyebrow">Cách hoạt động</span>
            <h2>Từ buổi tập đến bảng điểm, không cần thao tác thủ công</h2>
            <p>Học sinh chỉ cần đứng trước máy và tập. Mọi việc ghi nhận, chấm điểm và đồng bộ đều tự động.</p>
          </div>
          <div class="lp-grid3">
            ${step(1,'Chọn hồ sơ và bài tập','Học sinh chọn tên mình trên màn hình máy PoseAI, chọn Squat, Plank hay Push-up rồi bắt đầu.')}
            ${step(2,'AI quan sát và chấm điểm','Camera nhận diện khung xương theo thời gian thực, đếm số lần, bắt lỗi tư thế và tính điểm cho cả buổi.')}
            ${step(3,'Kết quả lên bảng theo dõi','Điểm, số lần, thời lượng và danh sách lỗi được gửi lên bảng của giáo viên ngay sau khi kết thúc.')}
          </div>
        </div>
      </section>

      <section class="lp-sec" id="bai-tap">
        <div class="lp-wrap">
          <div class="lp-sec-head">
            <span class="lp-eyebrow">Bài tập</span>
            <h2>Ba bài tập cơ bản, mỗi bài một bộ tiêu chí riêng</h2>
            <p>Mỗi bài tập có cách tính điểm và nhóm lỗi tư thế riêng, bám theo những lỗi học sinh hay mắc nhất.</p>
          </div>
          <div class="lp-grid3">
            ${exCard('var(--c-squat)',icoSquat,'Squat','Đếm số lần đứng lên ngồi xuống và kiểm tra độ sâu, độ thẳng của thân người.',['Lưng cong khi hạ người','Gối vượt quá mũi chân','Hạ chưa đủ sâu'])}
            ${exCard('var(--c-plank)',icoPlank,'Plank','Tính thời lượng giữ tư thế và theo dõi đường thẳng từ vai đến gót chân.',['Hông võng xuống','Hông nhô quá cao','Lệch vai, mất cân bằng'])}
            ${exCard('var(--c-pushup)',icoPushup,'Push-up','Đếm số lần chống đẩy hợp lệ dựa trên biên độ khuỷu tay và thân người.',['Khuỷu tay chưa gập đủ','Thân người không thẳng','Hạ xuống chưa đủ thấp'])}
          </div>
        </div>
      </section>

      <section class="lp-sec alt" id="giao-vien">
        <div class="lp-wrap lp-split">
          <div>
            <span class="lp-eyebrow">Cho giáo viên</span>
            <h2>Theo dõi cả lớp trên một màn hình</h2>
            <p class="lp-lead">Bảng theo dõi cho biết em nào đang tiến bộ, em nào lâu chưa tập và lớp hay mắc lỗi tư thế nào nhất — không phải ghi chép tay.</p>
            <div class="lp-feats">
              ${feat(icoChart,'Thống kê theo lớp và theo từng em','Điểm trung bình, số buổi, xu hướng tiến bộ, bảng xếp hạng và lịch tập 12 tuần.')}
              ${feat(icoBolt,'Nhắc em cần chú ý','Tự đánh dấu học sinh lâu chưa tập, điểm đang giảm hoặc điểm trung bình dưới 60.')}
              ${feat(icoDownload,'Xuất báo cáo và in','Tải danh sách học sinh hoặc buổi tập ra CSV, in báo cáo riêng cho từng em.')}
              ${feat(icoRefresh,'Sửa dữ liệu, máy tự đồng bộ','Thêm, đổi tên hay xoá học sinh trên web — máy PoseAI nhận lệnh ở lần đồng bộ kế tiếp.')}
            </div>
          </div>
          <div class="lp-prev" aria-hidden="true">
            <div class="lp-prev-top"><i></i><i></i><i></i><span>Tổng quan · 14 ngày</span></div>
            <div class="lp-prev-kpis">
              <div class="lp-prev-kpi"><b>128</b><span>buổi tập</span></div>
              <div class="lp-prev-kpi"><b>74,5</b><span>điểm TB</span></div>
              <div class="lp-prev-kpi"><b>18</b><span>em hoạt động</span></div>
            </div>
            <div class="lp-prev-rows">
              <div class="lp-prev-row"><span class="nm">Nguyễn Văn An</span><span class="tag" style="--c:var(--c-squat)">Squat</span><span class="pill good">88</span></div>
              <div class="lp-prev-row"><span class="nm">Trần Thị Bình</span><span class="tag" style="--c:var(--c-plank)">Plank</span><span class="pill mid">71</span></div>
              <div class="lp-prev-row"><span class="nm">Lê Hoàng Cường</span><span class="tag" style="--c:var(--c-pushup)">Push-up</span><span class="pill good">83</span></div>
              <div class="lp-prev-row"><span class="nm">Phạm Thị Dung</span><span class="tag" style="--c:var(--c-squat)">Squat</span><span class="pill low">58</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="lp-sec" id="tinh-nang">
        <div class="lp-wrap">
          <div class="lp-sec-head">
            <span class="lp-eyebrow">Thiết bị và quyền riêng tư</span>
            <h2>Một máy đặt tại phòng tập, dữ liệu gọn nhẹ</h2>
          </div>
          <div class="lp-grid3">
            <div class="lp-card"><div class="lp-step-n">${icoDevice}</div><h3>Chạy trên máy tại chỗ</h3><p>PoseAI chạy trên một máy nhỏ đặt sẵn ở phòng tập, có màn hình cảm ứng để học sinh tự thao tác.</p></div>
            <div class="lp-card"><div class="lp-step-n">${icoShield}</div><h3>Không lưu hình ảnh</h3><p>Camera chỉ dùng để nhận diện tư thế ngay tại máy. Hệ thống không lưu và không gửi đi video hay ảnh của học sinh.</p></div>
            <div class="lp-card"><div class="lp-step-n">${icoBolt}</div><h3>Vẫn chạy khi mạng chập chờn</h3><p>Buổi tập được ghi lại ngay trên máy, khi có mạng sẽ tự đồng bộ lên bảng theo dõi.</p></div>
          </div>
        </div>
      </section>

      <section class="lp-sec alt" id="facebook">
        <div class="lp-wrap">
          <div class="lp-sec-head">
            <span class="lp-eyebrow">Cộng đồng</span>
            <h2>Theo dõi PoseAI trên Facebook</h2>
            <p>Hoạt động tại phòng tập, mẹo tập đúng tư thế và tin tức về thiết bị đều được đăng trên trang Facebook của PoseAI.</p>
          </div>
          <div class="lp-fb">
            <div class="lp-fb-panel">
              <div class="lp-fb-brand">
                <span class="ico">${icoFacebook}</span>
                <span><b>Pose AI</b><span>Trang Facebook chính thức</span></span>
              </div>
              <p>Bấm theo dõi để nhận bài đăng mới ngay trên bảng tin của bạn.</p>
              <a class="btn-primary" href="${FB_PAGE_URL}" target="_blank" rel="noopener noreferrer">${icoFacebook}Theo dõi trên Facebook</a>
              <div class="lp-fb-embed lp-fb-side-embed">
                <iframe id="fbPageEmbed" height="70" title="Trang Facebook của PoseAI" loading="lazy"
                  scrolling="no" frameborder="0" allow="clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
              </div>
              <p class="lp-fb-note">Khung theo dõi do Facebook cung cấp. Nếu bạn chặn nội dung của Facebook thì khung này có thể không hiện — dùng nút phía trên để mở trang.</p>
            </div>
            <div>
              <div class="lp-fb-embed lp-fb-post">
                <iframe id="fbPostEmbed" height="${FB_POST_HEIGHT}" title="Bài đăng trên trang Facebook của PoseAI" loading="lazy"
                  scrolling="no" frameborder="0" allow="clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
              </div>
              <a class="lp-fb-link" href="${FB_POST_URL}" target="_blank" rel="noopener noreferrer">${icoExternal}Xem bài đăng đầy đủ trên Facebook</a>
            </div>
          </div>
        </div>
      </section>

      <section class="lp-sec lp-login" id="dang-nhap">
        <div class="lp-wrap">
          <div class="lp-sec-head">
            <span class="lp-eyebrow">Khu vực giáo viên</span>
            <h2>Đăng nhập để xem bảng theo dõi</h2>
            <p>Dành cho giáo viên phụ trách. Tài khoản do quản trị viên cấp.</p>
          </div>
          <div class="login-card" style="margin:0 auto">
            <form id="loginForm">
              <label for="email">Email giáo viên</label>
              <input id="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
              <label for="pw">Mật khẩu</label>
              <input id="pw" type="password" required autocomplete="current-password">
              <div class="err" id="loginErr">${prefillErr?esc(prefillErr):''}</div>
              <button type="submit" id="loginBtn" class="btn-primary">Đăng nhập</button>
              <div style="text-align:right;margin-top:10px"><button type="button" id="forgotBtn" class="link-btn">Quên mật khẩu?</button></div>
              <div class="field-msg" id="forgotMsg"></div>
            </form>
            <p class="hint">Liên hệ quản trị viên nếu bạn cần tài khoản mới.</p>
            <button type="button" class="btn-ghost" data-install hidden style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px"><svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">${icoInstall.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>Cài đặt ứng dụng</button>
          </div>
        </div>
      </section>
    </main>
    <footer class="lp-foot">PoseAI · Thiết bị huấn luyện tư thế vận động ứng dụng AI phòng ngừa chấn thương và huấn luyện thể chất.</footer>
  </div>`;
  document.querySelectorAll('[data-install]').forEach(b=>b.addEventListener('click',doInstall));
  updateInstallUI();
  initHeroModel();
  initFacebookEmbeds();
  /* Tự xử lý các liên kết neo thay vì để trình duyệt nhảy theo #hash:
     - không làm bẩn URL bằng #tinh-nang… (hash còn sót lại sẽ bị bảng điều khiển
       đọc nhầm thành tên màn hình sau khi đăng nhập),
     - không kích hoạt sự kiện hashchange của phần bảng điều khiển,
     - cuộn mượt có trừ sẵn chiều cao thanh điều hướng dính (qua scroll-margin-top). */
  const lpRoot=document.querySelector('.lp');
  lpRoot.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#"]');
    if(!a) return;
    const id=a.getAttribute('href').slice(1);
    const target=id?document.getElementById(id):null;
    e.preventDefault();
    if(!target) return;
    const smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});
    /* Tới khung đăng nhập thì đặt sẵn con trỏ vào ô email cho đỡ phải bấm thêm */
    if(id==='dang-nhap'){
      setTimeout(()=>{const i=document.getElementById('email'); if(i) i.focus({preventScroll:true})},smooth?500:0);
    }
  });
  if(prefillErr){
    const sec=document.getElementById('dang-nhap');
    if(sec) sec.scrollIntoView({block:'center'});
  }
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('loginBtn'), errEl=document.getElementById('loginErr');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pw').value;
    btn.disabled=true; btn.textContent='Đang đăng nhập…'; errEl.textContent='';
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ errEl.textContent=error.message==='Invalid login credentials'?'Email hoặc mật khẩu không đúng.':error.message; btn.disabled=false; btn.textContent='Đăng nhập'; }
  });
  document.getElementById('forgotBtn').addEventListener('click',async()=>{
    const email=document.getElementById('email').value.trim();
    const msg=document.getElementById('forgotMsg');
    if(!email){ msg.textContent='Nhập email trước khi bấm Quên mật khẩu.'; msg.className='field-msg bad'; document.getElementById('email').focus(); return }
    const btn=document.getElementById('forgotBtn');
    btn.disabled=true;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    btn.disabled=false;
    if(error){ msg.textContent=error.message; msg.className='field-msg bad'; return }
    msg.textContent='Đã gửi email đặt lại mật khẩu (nếu email tồn tại trong hệ thống).'; msg.className='field-msg ok';
  });
}

/* ===== Điều phối ===== */
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(session&&session.user){ if(!booted){booted=true;bootData(session.user)} }
  else{ booted=false; renderLogin(); }
});
sb.auth.getSession().then(({data})=>{
  if(data&&data.session&&data.session.user){ if(!booted){booted=true;bootData(data.session.user)} }
  else{ renderLogin(); }
});
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
    });
  }
</script>
</body>
</html>
